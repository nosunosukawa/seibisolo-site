mekanik kelas 1 sepeda motor atau kelas 2 yang sudah menyelesaikan kursus perawatan sistem kontrol elektronik dari Kepala Departemen Pengawasan Transportasi atau Kepala Kantor Cabang Transportasi. Hanya lulus kelas 2 tidak cukup. Soal ini meminta \"kombinasi yang TIDAK tepat\", jadi jawaban yang benar adalah (4). Untuk 16 orang, 16÷4＝4, jadi perlu 4 orang atau lebih. 3 orang di (ロ) tidak cukup. (Peraturan Pelaksanaan Pasal 57)","perChoice":["○ Untuk 3 orang, 3÷4＝0.75, dibulatkan ke atas menjadi 1 orang atau lebih. Cocok dengan 1 orang di (ロ), jadi kombinasi yang tepat.","○ Untuk 8 orang, 8÷4＝2, jadi 2 orang atau lebih. Cocok dengan 2 orang di (ロ), jadi kombinasi yang tepat.","○ Untuk 10 orang, 10÷4＝2.5, dibulatkan ke atas menjadi 3 orang atau lebih. Cocok dengan 3 orang di (ロ), jadi kombinasi yang tepat.","× \"3 orang\" di (ロ) salah. Untuk 16 orang, 16÷4＝4 → Yang benar: perlu 4 orang atau lebih. Ini kombinasi yang TIDAK tepat."]},"terms":[{"ja":"道路運送車両法施行規則","t":"Peraturan Pelaksanaan Undang-Undang Kendaraan Angkutan Jalan"},{"ja":"分解整備","t":"perawatan dengan pembongkaran (overhaul)"},{"ja":"整備主任者","t":"kepala mekanik penanggung jawab"},{"ja":"自動車特定整備事業","t":"usaha perawatan tertentu kendaraan bermotor"},{"ja":"技能検定","t":"ujian sertifikasi keterampilan"},{"ja":"自動車整備士","t":"mekanik otomotif (seibishi)"}]},"si":{"stem":"「මාර්ග ප්‍රවාහන වාහන පනතේ ක්‍රියාත්මක කිරීමේ නියෝග」 (Enforcement Regulations of the Road Transport Vehicle Act) අනුව, පහත ප්‍රකාශයේ (イ) සහ (ロ) සඳහා ගැළපෙන දේ ලෙස, පහත සංයෝජන අතරින් 【සුදුසු නොවන】 එක කුමක්ද?\ndisassembly maintenance සහ electronic control device maintenance කරන workshop එකක් වන, සේවයේ යෙදෙන සේවක සංඛ්‍යාව (chief maintenance technician ද ඇතුළුව) (イ) වන, specified automobile maintenance business certification ලත් workshop එකක, 1 වන, 2 වන හෝ 3 වන ශ්‍රේණියේ automobile mechanic skill test සමත් අය (ロ) හෝ ඊට වැඩි ගණනක් සිටිය යුතුය.","choices":["(イ) 3 දෙනා　(ロ) 1 දෙනා","(イ) 8 දෙනා　(ロ) 2 දෙනා","(イ) 10 දෙනා　(ロ) 3 දෙනා","(イ) 16 දෙනා　(ロ) 3 දෙනා"],"ex":{"text":"මාර්ග ප්‍රවාහන වාහන පනතේ ක්‍රියාත්මක කිරීමේ රෙගුලාසි (Road Transport Vehicle Act Enforcement Regulations) වල certification ප්‍රමිතිය ගැන ප්‍රශ්නයකි. specified maintenance කරන සේවකයන් 2 දෙනෙක් හෝ වැඩි ගණනක් අවශ්‍යයි. ඔවුන් අතරින් class 1, class 2, class 3 mechanic විභාගය සමත් අය, සේවක ගණන 4 න් බෙදූ ගණනට (1 ට අඩු කොටස 1 ලෙස ගනී, එනම් round up) සමාන හෝ වැඩි විය යුතුයි. උදාහරණ: 5 දෙනා→2, 8 දෙනා→2, 9 දෙනා→3, 10 දෙනා→3, 16 දෙනා→4, 17 දෙනා→5. තවද මෙම shop එක overhaul maintenance සහ electronic control system maintenance දෙකම කරන නිසා, අවම වශයෙන් 1 කෙනෙක් මේවායින් එකක් විය යුතුයි. ① class 1 mechanic (class 1 motorcycle හැර). ② Transport Supervision Department ප්‍රධානියා හෝ Transport Branch Office ප්‍රධානියා පවත්වන electronic control system maintenance පුහුණුව අවසන් කළ class 1 motorcycle හෝ class 2 mechanic. class 2 සමත් වීම පමණක් ප්‍රමාණවත් නැත. මෙම ප්‍රශ්නය 【සුදුසු නොවන】 combination එක අසයි, එබැවින් නිවැරදි පිළිතුර (4) වේ. 16 දෙනා නම් 16÷4＝4, 4 දෙනෙක් හෝ වැඩි අවශ්‍යයි. (ロ) හි 3 දෙනා ප්‍රමාණවත් නැත. (රෙගුලාසි 57 වගන්තිය)","perChoice":["○ 3 දෙනා නම් 3÷4＝0.75, round up කර 1 දෙනෙක් හෝ වැඩි. (ロ) හි 1 දෙනාට ගැළපෙන නිසා සුදුසු combination එකකි.","○ 8 දෙනා නම් 8÷4＝2, 2 දෙනෙක් හෝ වැඩි. (ロ) හි 2 දෙනාට ගැළපෙන නිසා සුදුසු combination එකකි.","○ 10 දෙනා නම් 10÷4＝2.5, round up කර 3 දෙනෙක් හෝ වැඩි. (ロ) හි 3 දෙනාට ගැළපෙන නිසා සුදුසු combination එකකි.","× (ロ) හි \"3 දෙනා\" වැරදියි. 16 දෙනා නම් 16÷4＝4 → නිවැරදි කරුණ: 4 දෙනෙක් හෝ වැඩි අවශ්‍යයි. මෙය 【සුදුසු නොවන】 combination එකයි."]},"terms":[{"ja":"道路運送車両法施行規則","t":"මාර්ග ප්‍රවාහන වාහන පනතේ ක්‍රියාත්මක කිරීමේ රෙගුලාසි"},{"ja":"分解整備","t":"විසුරුවා හැරීමේ නඩත්තුව"},{"ja":"整備主任者","t":"නඩත්තු ප්‍රධානියා"},{"ja":"自動車特定整備事業","t":"මෝටර් රථ විශේෂිත නඩත්තු ව්‍යාපාරය"},{"ja":"技能検定","t":"කුසලතා පරීක්ෂණය"},{"ja":"自動車整備士","t":"මෝටර් රථ කාර්මිකයා"}]},"my":{"stem":"「လမ်းပို့ဆောင်ရေး ယာဉ်များဆိုင်ရာ ဥပဒေ အကောင်အထည်ဖော်ရေး နည်းဥပဒေ (道路運送車両法施行規則)」 အရ အောက်ပါ စာပိုဒ်ရှိ (イ) နှင့် (ロ) ထဲသို့ ထည့်ရမည့် အရာများအဖြစ် အောက်ပါ ပေါင်းစပ်မှုများအနက် 【မသင့်လျော်သည့်】တစ်ခုမှာ မည်သည်နည်း။\nဖြုတ်ပြုပြင်ခြင်း (disassembly maintenance) နှင့် အီလက်ထရွန်နစ် ထိန်းချုပ်ကိရိယာ ပြုပြင်ခြင်း (electronic control device maintenance) တို့ကို ပြုလုပ်သော လုပ်ငန်းခွင် (workshop) ဖြစ်ပြီး လုပ်ကိုင်သော ဝန်ထမ်း (ပြုပြင်ထိန်းသိမ်းရေး အဓိက တာဝန်ခံ (整備主任者) အပါအဝင်) အရေအတွက် (イ) ရှိသော မော်တော်ယာဉ် သတ်မှတ် ပြုပြင်ထိန်းသိမ်းရေး လုပ်ငန်း (specified maintenance business) အသိအမှတ်ပြုချက် (certification) ရထားသော လုပ်ငန်းခွင်တွင် အဆင့် 1၊ အဆင့် 2 သို့မဟုတ် အဆင့် 3 မော်တော်ယာဉ် ပြုပြင်ထိန်းသိမ်းသူ (automobile mechanic) ကျွမ်းကျင်မှု စစ်ဆေးရေး စာမေးပွဲ (skills test) အောင်ထားသူ (ロ) နှင့်အထက် ရှိရမည်။","choices":["(イ) 3 ဦး　(ロ) 1 ဦး","(イ) 8 ဦး　(ロ) 2 ဦး","(イ) 10 ဦး　(ロ) 3 ဦး","(イ) 16 ဦး　(ロ) 3 ဦး"],"ex":{"text":"လမ်းပို့ဆောင်ရေးယာဉ်ဥပဒေ အကောင်အထည်ဖော်စည်းမျဉ်း (Road Transport Vehicle Act Enforcement Regulations) ၏ certification စံနှုန်း မေးခွန်းဖြစ်သည်။ specified maintenance လုပ်သော ဝန်ထမ်း 2 ဦး နှင့်အထက် လိုသည်။ ၎င်းတို့ထဲမှ class 1၊ class 2၊ class 3 mechanic စာမေးပွဲ အောင်သူသည် ဝန်ထမ်းအရေအတွက်ကို 4 ဖြင့်စားသော အရေအတွက် (1 အောက် အကြွင်းကို 1 ဟုယူ၊ round up) နှင့်အထက် ရှိရမည်။ ဥပမာ- 5 ဦး→2 ဦး၊ 8 ဦး→2 ဦး၊ 9 ဦး→3 ဦး၊ 10 ဦး→3 ဦး၊ 16 ဦး→4 ဦး၊ 17 ဦး→5 ဦး။ ထို့ပြင် ဤ shop သည် overhaul maintenance နှင့် electronic control system maintenance နှစ်ခုလုံး လုပ်သဖြင့် အနည်းဆုံး 1 ဦးသည် အောက်ပါတစ်ခု ဖြစ်ရမည်။ ① class 1 mechanic (class 1 motorcycle မပါ)။ ② Transport Supervision Department ဦးစီးမှူး သို့မဟုတ် Transport Branch Office ဦးစီးမှူး ကျင်းပသော electronic control system maintenance သင်တန်း ပြီးဆုံးသူ class 1 motorcycle သို့မဟုတ် class 2 mechanic။ class 2 အောင်ရုံဖြင့် မလုံလောက်ပါ။ ဤမေးခွန်းသည် 【မသင့်လျော်】သော combination ကို ရွေးရသဖြင့် အဖြေမှန်မှာ (4) ဖြစ်သည်။ 16 ဦးဆိုလျှင် 16÷4＝4 ဖြစ်၍ 4 ဦးနှင့်အထက် လိုသည်။ (ロ) ၏ 3 ဦး မလုံလောက်ပါ။ (စည်းမျဉ်း ပုဒ်မ 57)","perChoice":["○ 3 ဦးဆိုလျှင် 3÷4＝0.75၊ round up လုပ်၍ 1 ဦးနှင့်အထက်။ (ロ) ၏ 1 ဦးနှင့် ကိုက်ညီသဖြင့် သင့်လျော်သော combination။","○ 8 ဦးဆိုလျှင် 8÷4＝2၊ 2 ဦးနှင့်အထက်။ (ロ) ၏ 2 ဦးနှင့် ကိုက်ညီသဖြင့် သင့်လျော်သော combination။","○ 10 ဦးဆိုလျှင် 10÷4＝2.5၊ round up လုပ်၍ 3 ဦးနှင့်အထက်။ (ロ) ၏ 3 ဦးနှင့် ကိုက်ညီသဖြင့် သင့်လျော်သော combination။","× (ロ) ၏「3 ဦး」မှားသည်။ 16 ဦးဆိုလျှင် 16÷4＝4 → အမှန်မှာ- 4 ဦးနှင့်အထက် လိုသည်။ ဤသည်မှာ 【မသင့်လျော်】သော combination ဖြစ်သည်။"]},"terms":[{"ja":"道路運送車両法施行規則","t":"လမ်းပို့ဆောင်ရေး ယာဉ်များဆိုင်ရာ ဥပဒေ အကောင်အထည်ဖော် စည်းမျဉ်း (Enforcement Regulations)"},{"ja":"分解整備","t":"ဖြုတ်၍ ပြုပြင်ထိန်းသိမ်းခြင်း (disassembly maintenance)"},{"ja":"整備主任者","t":"ပြုပြင်ထိန်းသိမ်းရေး အဓိက တာဝန်ခံ (chief maintenance manager)"},{"ja":"自動車特定整備事業","t":"မော်တော်ယာဉ် သတ်မှတ်ထားသော ပြုပြင်ထိန်းသိမ်းရေး လုပ်ငန်း (specified maintenance business)"},{"ja":"技能検定","t":"ကျွမ်းကျင်မှု စစ်ဆေးရေး စာမေးပွဲ (skills certification exam)"},{"ja":"自動車整備士","t":"မော်တော်ယာဉ် ပြုပြင်ထိန်းသိမ်းရေး ကျွမ်းကျင်သူ (automobile mechanic)"}]}}}]</script>
<script>

  // ルビ記法 {漢字|よみ} を <ruby> に。改行は <br>

    h+='<p class="src">No.'+q.no+'　'+esc(q.label.replace(/ No\.\d+$/,''))+'（過去問）</p>';
    h+='<p class="stem">'+ruby(q.stem)+'</p>'+(tr?trLine(tr.stem,st.lang):'');
    if(q.fig){h+='<button type="button" class="fig" id="figBtn" aria-label="問題の図。押すと大きく見られます"><img src="'+q.fig+'" alt="問題の図"></button><p class="fighint"><ruby>図<rt>ず</rt></ruby>を<ruby>押<rt>お</rt></ruby>すと<ruby>大<rt>おお</rt></ruby>きく<ruby>見<rt>み</rt></ruby>られます</p>';}
    h+='<ol class="choices" role="radiogroup" aria-label="選択肢">';
    q.choices.forEach(function(c,k){
      var n=k+1,isA=q.answer===n,isS=st.sel===n,cls='ch';
      if(st.rev){cls+=isA?' ok':isS?' ng':''}else if(isS)cls+=' sel';
      var mk=st.rev&&(isA||isS)?'<span class="mk" style="background:'+(isA?'var(--ok-fill)':'var(--ng-fill)')+'">'+(isA?'✓':'✕')+'</span>':'';
      h+='<li><button type="button" class="'+cls+'" data-n="'+n+'" role="radio" aria-checked="'+isS+'"'+(st.rev?' disabled':'')+'><span class="n">'+n+'</span><span class="t">'+ruby(c)+(tr&&tr.choices[k]?trLine(tr.choices[k],st.lang):'')+'</span>'+mk+'</button></li>';
    });
    h+='</ol>';
    if(st.rev){
      h+='<div class="exp" id="exp"><h2>解説</h2><p class="ans"><ruby>正解<rt>せいかい</rt></ruby>は ('+q.answer+')</p>';
      (q.exp.perChoice||[]).forEach(function(p,k){if(p)h+='<div class="pc"><b>('+(k+1)+')</b><span>'+ruby(p)+'</span></div>'});
      h+='<p class="more">くわしい説明</p><p class="etext">'+ruby(q.exp.text)+'</p>';
      if(tr&&tr.ex){
        h+='<div class="extr" lang="'+LN[st.lang]+'"><p class="h" lang="ja">解説の参考訳</p><p>'+esc(tr.ex.text)+'</p>';
        (tr.ex.perChoice||[]).forEach(function(p,k){if(p)h+='<p>('+(k+1)+') '+esc(p)+'</p>'});
        if(tr.terms.length){h+='<p class="h" lang="ja">この問題の用語</p><ul class="terms">';tr.terms.forEach(function(x){h+='<li><span lang="ja" style="color:var(--ink);margin:0">'+esc(x.ja)+'</span><span>'+esc(x.t)+'</span></li>'});h+='</ul>'}
        h+='</div>';
      }
      h+='</div>';
    }
    var art=$('q');art.innerHTML=h;
    $('ainote').hidden=!st.lang;
    $('count').textContent=(st.i+1)+' / '+Q.length;
    $('bar').style.width=(st.res.length/Q.length*100)+'%';
    var a=$('act'),ai=$('actIn');
    if(st.rev){
      var ok=st.sel===q.answer;a.className='act '+(ok?'ok':'ng');
      ai.innerHTML='<div class="res"><i style="background:var('+(ok?'--ok':'--ng')+')">'+(ok?'✓':'✕')+'</i><div><strong style="color:var('+(ok?'--ok':'--ng')+')">'+(ok?'正解':'正解は '+q.answer)+'</strong><button type="button" class="jump" id="toExp">解説を見る ↓</button></div></div><button type="button" class="btn next" id="nextBtn">'+(st.i===Q.length-1?'結果を見る':'次の問題')+'</button>';
    }else{
      a.className='act';
      ai.innerHTML='<button type="button" class="btn" id="ansBtn"'+(st.sel==null?' disabled':'')+'>'+(st.sel==null?'選択肢を選んでください':st.sel+' で答える')+'</button>';
    }
  }

  $('q').addEventListener('click',function(e){
    var b=e.target.closest('.ch');
    if(b&&!st.rev){st.sel=+b.dataset.n;render();return}
    if(e.target.closest('#figBtn')){$('zoomImg').src=Q[st.i].fig;$('zoom').classList.add('on');$('zoomClose').focus()}
  });
  $('actIn').addEventListener('click',function(e){
    if(e.target.closest('#ansBtn')&&st.sel!=null){st.rev=true;st.res.push(st.sel===Q[st.i].answer);stopSpeak();render();var ex=$('exp');if(ex)ex.scrollIntoView({behavior:'smooth',block:'start'});return}
    if(e.target.closest('#toExp')){$('exp').scrollIntoView({behavior:'smooth',block:'start'});return}
    if(e.target.closest('#nextBtn')){
      stopSpeak();
      if(st.i<Q.length-1){st.i++;st.sel=null;st.rev=false;render();window.scrollTo(0,0)}else finish();
    }
  });
  function close(){$('zoom').classList.remove('on')}
  $('zoomClose').addEventListener('click',close);
  $('zoom').addEventListener('click',function(e){if(e.target===this)close()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});

  // ふりがな
  $('rubyBtn').addEventListener('click',function(){
    st.ruby=!st.ruby;this.setAttribute('aria-pressed',st.ruby);document.body.classList.toggle('noruby',!st.ruby);
  });
  // 参考訳のことば
  $('langs').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    [].forEach.call(this.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',x===b)});
    st.lang=b.dataset.l;render();
  });

  // 読み上げ（Web Speech API・ja-JP）。漢字のままの文を、日本語の声のうち一番自然なもの（Premium・Enhanced・Siri・Google・Natural）で読む（かなだけで渡すと抑揚が消えて機械的だった・社長 11/7）。使えないブラウザではボタンを出さない
  var synth=window.speechSynthesis,sp=$('speakBtn'),speaking=false;
  if(synth&&window.SpeechSynthesisUtterance){
    sp.hidden=false;
    sp.addEventListener('click',function(){
      if(speaking){stopSpeak();return}
      var base=function(t){return String(t||'').replace(/\{([^|{}]+)\|([^{}]+)\}/g,'$1')};
      var q=Q[st.i],parts=[base(q.stem)];
      q.choices.forEach(function(c,k){parts.push((k+1)+'、'+base(c))});
      var u=new SpeechSynthesisUtterance(parts.map(function(x){return x.trim().replace(/[。．.]+$/,'')}).join('。\n'));
      u.lang='ja-JP';u.rate=0.95;
      var sc=function(v){return (/premium|プレミアム/i.test(v.name)?4:0)+(/enhanced|拡張|siri|natural|google/i.test(v.name)?2:0)+(/compact/i.test(v.voiceURI||'')?-1:0)};
      var v=(synth.getVoices()||[]).filter(function(v){return /^ja/i.test(v.lang)}).sort(function(a,b){return sc(b)-sc(a)})[0];if(v)u.voice=v;
      u.onend=u.onerror=function(){speaking=false;sp.textContent='読む';sp.setAttribute('aria-pressed','false')};
      synth.cancel();synth.speak(u);speaking=true;sp.textContent='止める';sp.setAttribute('aria-pressed','true');
    });
  }
  function stopSpeak(){if(synth&&speaking){synth.cancel()}speaking=false;sp.textContent='読む';sp.setAttribute('aria-pressed','false')}

  // 試験時間の残り（2級の総合は80分）。時刻で数える。0 で「時間です」（解き続けられる）
  function tick(){
    var left=Math.max(0,LIMIT-Math.floor((Date.now()-st.start)/1000)),m=Math.floor(left/60),s=left%60;
    var t=$('timer');t.classList.toggle('soon',left<=300);
    if(left<=0){t.innerHTML='<span><ruby>時間<rt>じかん</rt></ruby>です</span>';clearInterval(tm);return}
    $('clock').textContent=m+':'+(s<10?'0':'')+s;
    t.setAttribute('aria-label','残り '+m+'分'+s+'秒');
  }
  var tm=setInterval(tick,1000);

  function finish(){
    clearInterval(tm);
    var n=st.res.filter(Boolean).length,h='';
    h+='<h2><ruby>結果<rt>けっか</rt></ruby></h2><p class="score">'+n+'<span>問 正解 ／</span>'+Q.length+'<span>問</span></p>';
    h+='<ul class="rows">';Q.forEach(function(q,k){h+='<li><b style="color:var('+(st.res[k]?'--ok':'--ng')+')">'+(st.res[k]?'○':'×')+'</b><span>No.'+q.no+'　'+esc(q.label.replace(/ No\.\d+$/,''))+'</span></li>'});h+='</ul>';
    h+='<p>アプリでは、2級の「総合の予想問題」40問を、買わずに全部解けます。</p>';
    h+='<a class="cta" href="https://apps.apple.com/app/apple-store/id6827350748?pt=129256714&amp;ct=demo&amp;mt=8">App Store で見る</a>';
    h+='<button type="button" class="ghost" id="again">もう一度 5問を解く</button>';
    h+='<a class="ghost" href="./">ふりがな整備士の紹介へ戻る</a>';
    $('quiz').hidden=true;$('act').hidden=true;var d=$('done');d.innerHTML=h;d.hidden=false;
    $('count').textContent='結果';$('bar').style.width='100%';window.scrollTo(0,0);
    $('again').addEventListener('click',function(){st={i:0,sel:null,rev:false,lang:st.lang,ruby:st.ruby,res:[],start:Date.now()};d.hidden=true;$('quiz').hidden=false;$('act').hidden=false;
      $('timer').innerHTML='<span><ruby>残<rt>のこ</rt></ruby>り <span id="clock">80:00</span></span>';tm=setInterval(tick,1000);render();window.scrollTo(0,0)});
  }
  render();
})();
</script>
</body>
</html>
