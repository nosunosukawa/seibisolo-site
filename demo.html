duQuestionType":"Multiple choice","inLanguage":"ja","suggestedAnswer":[{"@type":"Answer","text":"(2) マグネティック・バルブは、コントロール・シリンダへの圧縮エアの供給及び排出を行う。"},{"@type":"Answer","text":"(3) エキゾースト・ブレーキ作動時には、エキゾースト・ブレーキ・スイッチ、アクセル・スイッチ及びクラッチ・スイッチは ONになっている。"},{"@type":"Answer","text":"(4) エキゾースト・ブレーキ・カット・リレーは、通常時は ONとなって回路が接続されているが、ABS 作動時には、ブレーキECUにより OFFとなって回路が断たれる。"}],"acceptedAnswer":{"@type":"Answer","text":"(1) コントロール・シリンダは、負圧によってエキゾースト・ブレーキ・バルブの開閉を行う。"}},{"@type":"Question","name":"第4問（令和7年10月 二級ガソリン No.24）","text":"ツイスト・ペア線を用いた CAN通信に関する記述として、適切なものは次のうちどれか。","eduQuestionType":"Multiple choice","inLanguage":"ja","suggestedAnswer":[{"@type":"Answer","text":"(2) “バス・オフ”状態とは、エラーを検知した結果、リカバリが実行され、エラーが解消されて通信を再開した状態をいう。"},{"@type":"Answer","text":"(3) CAN通信では、バス・ライン上のデータを必要とする複数のECUは同時にデータ・フレームを受信することができない。"},{"@type":"Answer","text":"(4) CAN-H、CAN-Lともに2.5Vの状態をドミナントといい、CAN-Hが3.5V、CAN-Lが1.5Vの状態をレセシブという。"}],"acceptedAnswer":{"@type":"Answer","text":"(1) 各 ECUは、各センサの情報などをデータ・フレームとして、バス・ライン上に送信(定期送信データ)している。"}},{"@type":"Question","name":"第5問（令和7年10月 二級ジーゼル No.36）","text":"「道路運送車両法施行規則」に照らし、次の文章の(イ)と(ロ)に当てはまるものとして、下の組み合わせのうち、不適切なものはどれか。\n分解整備及び電子制御装置整備を行う事業場であって、従事する従業員(整備主任者を含む。)の数が(イ)の自動車特定整備事業の認証を受けた事業場には、一級、二級又は三級の自動車整備士の技能検定に合格した者が(ロ)以上であること。","eduQuestionType":"Multiple choice","inLanguage":"ja","suggestedAnswer":[{"@type":"Answer","text":"(1) (イ) 3人 (ロ) 1人"},{"@type":"Answer","text":"(2) (イ) 8人 (ロ) 2人"},{"@type":"Answer","text":"(3) (イ) 10人 (ロ) 3人"}],"acceptedAnswer":{"@type":"Answer","text":"(4) (イ) 16人 (ロ) 3人"}}]}

<script id="data" type="application/json">[{"id":"jaspa-R7.10-G-06","sogo":1,"label":"R7.10 二級ガソリン No.6","no":6,"stem":"シリンダ・ヘッドとピストンで{形成|けいせい}されるスキッシュ・エリアに{関|かん}する{記述|きじゅつ}として、{不適切|ふてきせつ}なものは{次|つぎ}のうちどれか。","choices":["スキッシュ・エリアの{面積|めんせき}が{大|おお}きくなるほど{混合気|こんごうき}の{渦流|かりゅう}の{流速|りゅうそく}は{高|たか}くなる。","{斜|なな}めスキッシュ・エリアは、{斜|なな}め{形状|けいじょう}により{吸入通路|きゅうにゅうつうろ}からの{吸気|きゅうき}がスムーズになり、{強|つよ}い{渦流|かりゅう}の{発生|はっせい}が{得|え}られる。","スキッシュ・エリアによる{渦流|かりゅう}は、{燃焼|ねんしょう}{行程|こうてい}における{火炎伝|かえんでん}{播|は}の{速度|そくど}を{低|ひく}くし、{混合気|こんごうき}の{燃焼|ねんしょう}{時間|じかん}を{延長|えんちょう}することで{最高|さいこう}{燃焼|ねんしょう}ガス{温度|おんど}の{上昇|じょうしょう}を{促進|そくしん}させる{役目|やくめ}を{担|にな}っている。","スキッシュ・エリアの{厚|あつ}み(クリアランス)が{小|ちい}さくなるほど{混合気|こんごうき}の{渦流|かりゅう}の{流速|りゅうそく}は{高|たか}くなる。"],"parts":null,"partLabels":null,"answer":3,"fig":null,"exp":{"text":"スキッシュ・エリアはシリンダ・ヘッド{底面|ていめん}とピストン{頂面|ちょうめん}の{隙間|すきま}。{上死点|じょうしてん}{近|ちか}くで{混合気|こんごうき}がここから{押|お}し{出|だ}されて{渦流|かりゅう}ができる。{渦流|かりゅう}は{面積|めんせき}が{大|おお}きいほど、{厚|あつ}み（クリアランス）が{小|ちい}さいほど{速|はや}い。{渦流|かりゅう}は{燃焼|ねんしょう}{行程|こうてい}の{火炎伝|かえんでん}{播|は}を{速|はや}め、{燃焼|ねんしょう}{時間|じかん}を{短|みじか}くして{最高|さいこう}{燃焼|ねんしょう}ガス{温度|おんど}の{上昇|じょうしょう}を{抑|おさ}える。{正解|せいかい}は(3)。(3)は「{火炎伝|かえんでん}{播|は}を{遅|おそ}くし{燃焼|ねんしょう}{時間|じかん}を{延長|えんちょう}して{最高|さいこう}{燃焼|ねんしょう}ガス{温度|おんど}の{上昇|じょうしょう}を{促進|そくしん}」が{誤|あやま}り。{正|ただ}しくは{火炎伝|かえんでん}{播|は}を{速|はや}め、{燃焼|ねんしょう}{時間|じかん}を{短|みじか}くして{温度|おんど}{上昇|じょうしょう}を{抑|おさ}える。ほかの3つは{正|ただ}しい{文|ぶん}。","perChoice":["○ スキッシュ・エリアの{面積|めんせき}が{大|おお}きいほど{渦流|かりゅう}の{流速|りゅうそく}は{高|たか}くなる。","○ {斜|なな}めスキッシュ・エリアは{吸気|きゅうき}がスムーズになり、{強|つよ}い{渦流|かりゅう}が{得|え}られる。","× {火炎伝|かえんでん}{播|は}を{遅|おそ}くし{燃焼|ねんしょう}{時間|じかん}を{延長|えんちょう}して{最高|さいこう}{燃焼|ねんしょう}ガス{温度|おんど}の{上昇|じょうしょう}を{促進|そくしん}→{正|ただ}しくは{火炎伝|かえんでん}{播|は}を{速|はや}め、{燃焼|ねんしょう}{時間|じかん}を{短|みじか}くして{温度|おんど}{上昇|じょうしょう}を{抑|おさ}える。","○ {厚|あつ}み（クリアランス）が{小|ちい}さいほど{渦流|かりゅう}の{流速|りゅうそく}は{高|たか}くなる。"]},"tr":{"en":{"stem":"Which of the following statements about the squish area formed by the cylinder head and the piston is inappropriate?","choices":["The larger the area of the squish area, the higher the flow velocity of the swirl of the air-fuel mixture.","An inclined squish area, because of its inclined shape, allows the intake air from the intake passage to flow smoothly, and a strong swirl is produced.","The swirl produced by the squish area serves to lower the flame propagation speed in the combustion stroke and to extend the combustion time of the mixture, thereby promoting a rise in the maximum combustion gas temperature.","The smaller the thickness (clearance) of the squish area, the higher the flow velocity of the swirl of the air-fuel mixture."],"ex":{"text":"The squish area is the gap between the bottom face of the cylinder head and the top face of the piston. Near top dead center, the mixture is pushed out of this gap and a swirl forms. The swirl is faster when the area is larger and when the thickness (clearance) is smaller. The swirl speeds up flame propagation in the combustion stroke. It shortens the combustion time and keeps the maximum combustion gas temperature from rising. The correct answer is (3). In (3), 'it slows down flame propagation, makes the combustion time longer, and helps the maximum combustion gas temperature rise' is wrong. Correct: it speeds up flame propagation, shortens the combustion time, and keeps the temperature from rising. The other three are correct statements.","perChoice":["○ The larger the squish area, the faster the swirl.","○ An inclined squish area lets intake air flow smoothly and gives a strong swirl.","× It slows down flame propagation, makes the combustion time longer, and helps the maximum combustion gas temperature rise → Correct: it speeds up flame propagation, shortens the combustion time, and keeps the temperature from rising.","○ The smaller the thickness (clearance), the faster the swirl."]},"terms":[{"ja":"スキッシュ・エリア","t":"squish area"},{"ja":"シリンダ・ヘッド","t":"cylinder head"},{"ja":"渦流","t":"swirl (vortex flow)"},{"ja":"火炎伝播","t":"flame propagation"},{"ja":"混合気","t":"air-fuel mixture"},{"ja":"燃焼行程","t":"combustion (power) stroke"}]},"ne":{"stem":"cylinder head र piston ले बनाउने squish area सम्बन्धी कथनहरूमध्ये 【अनुपयुक्त】 कुन हो?","choices":["squish area को area जति ठूलो हुन्छ, air-fuel mixture को swirl को flow velocity त्यति उच्च हुन्छ।","छड्के (inclined) squish area मा छड्के आकारका कारण intake passage बाट हावा सजिलै भित्र पस्छ, र बलियो swirl उत्पन्न हुन्छ।","squish area ले बनाउने swirl ले combustion stroke मा flame propagation को गति घटाएर air-fuel mixture को combustion time लम्ब्याई maximum combustion gas temperature बढ्न सघाउने भूमिका खेल्छ।","squish area को मोटाइ (clearance) जति सानो हुन्छ, air-fuel mixture को swirl को flow velocity त्यति उच्च हुन्छ।"],"ex":{"text":"स्किस एरिया (squish area) भनेको सिलिन्डर हेडको तल्लो सतह र पिस्टनको माथिल्लो सतहबीचको खाली ठाउँ हो। TDC नजिक मिश्रण यहाँबाट धकेलिएर बाहिर निस्कन्छ, र भुमरी प्रवाह (swirl) बन्छ। क्षेत्रफल जति ठूलो र मोटाइ (क्लियरेन्स) जति सानो, भुमरी प्रवाह त्यति छिटो हुन्छ। भुमरी प्रवाहले दहन स्ट्रोकमा ज्वाला फैलिने गति छिटो बनाउँछ, दहन समय छोटो बनाउँछ, र अधिकतम दहन ग्यास तापक्रम बढ्न दिँदैन। सही उत्तर (3) हो। (3) मा “ज्वाला फैलिने गति ढिलो बनाएर, दहन समय लामो बनाएर, अधिकतम दहन ग्यास तापक्रम बढाउँछ” भन्ने कुरा गलत हो। सही कुरा: ज्वाला फैलिने गति छिटो बनाउँछ, दहन समय छोटो बनाउँछ, र तापक्रम बढ्न दिँदैन। बाँकी 3 वटा कथन सही छन्।","perChoice":["○ स्किस एरियाको क्षेत्रफल जति ठूलो, भुमरी प्रवाहको गति त्यति उच्च हुन्छ।","○ तिर्छो स्किस एरियामा इन्टेक हावा सजिलै पस्छ, र बलियो भुमरी प्रवाह बन्छ।","× “ज्वाला फैलिने गति ढिलो बनाएर, दहन समय लामो बनाएर, अधिकतम दहन ग्यास तापक्रम बढाउँछ” भन्ने गलत हो। → सही कुरा: ज्वाला फैलिने गति छिटो बनाउँछ, दहन समय छोटो बनाउँछ, र तापक्रम बढ्न दिँदैन।","○ मोटाइ (क्लियरेन्स) जति सानो, भुमरी प्रवाहको गति त्यति उच्च हुन्छ।"]},"terms":[{"ja":"スキッシュ・エリア","t":"स्क्विस एरिया"},{"ja":"シリンダ・ヘッド","t":"सिलिन्डर हेड"},{"ja":"渦流","t":"भुमरी प्रवाह"},{"ja":"火炎伝播","t":"ज्वाला फैलावट"},{"ja":"混合気","t":"हावा-इन्धन मिश्रण"},{"ja":"燃焼行程","t":"दहन स्ट्रोक"}]},"zh":{"stem":"关于由气缸盖和活塞形成的挤气区（スキッシュ・エリア）的叙述中，不适当的是下列哪一项？","choices":["挤气区的面积越大，混合气涡流的流速越高。","倾斜挤气区由于其倾斜形状，来自进气通道的进气变得顺畅，可产生强涡流。","挤气区产生的涡流，起到降低燃烧行程中火焰传播速度、延长混合气燃烧时间，从而促进最高燃烧气体温度上升的作用。","挤气区的厚度（间隙）越小，混合气涡流的流速越高。"],"ex":{"text":"本题选【不恰当】的一项。挤气区是气缸盖底面与活塞顶面之间的间隙。在上止点附近，混合气从这里被挤出，形成涡流。面积越大、厚度（间隙）越小，涡流越快。涡流使做功行程的火焰传播变快，缩短燃烧时间，抑制最高燃烧气体温度的上升。正确答案是(3)。(3)的“使火焰传播变慢，延长燃烧时间，促进最高燃烧气体温度上升”是错误的（【不恰当】）。正确说法是使火焰传播变快，缩短燃烧时间，抑制温度上升。其他3个是正确的说法。","perChoice":["○ 挤气区面积越大，涡流流速越高。","○ 斜挤气区使进气更顺畅，能得到强涡流。","× 使火焰传播变慢，延长燃烧时间，促进最高燃烧气体温度上升 → 正确说法：使火焰传播变快，缩短燃烧时间，抑制温度上升。","○ 厚度（间隙）越小，涡流流速越高。"]},"terms":[{"ja":"スキッシュ・エリア","t":"挤气区"},{"ja":"シリンダ・ヘッド","t":"气缸盖"},{"ja":"渦流","t":"涡流"},{"ja":"火炎伝播","t":"火焰传播"},{"ja":"混合気","t":"混合气"},{"ja":"燃焼行程","t":"燃烧行程（做功行程）"}]},"vi":{"stem":"Về vùng squish (squish area) được tạo bởi nắp máy (cylinder head) và piston, câu nào sau đây là KHÔNG phù hợp?","choices":["Diện tích vùng squish càng lớn thì tốc độ dòng xoáy của hỗn hợp càng cao.","Vùng squish nghiêng (slant squish area), nhờ hình dạng nghiêng nên khí nạp từ đường nạp đi vào êm hơn, và tạo được dòng xoáy mạnh.","Dòng xoáy do vùng squish tạo ra có nhiệm vụ làm giảm tốc độ lan truyền ngọn lửa trong kỳ cháy (kỳ nổ), kéo dài thời gian cháy của hỗn hợp để thúc đẩy nhiệt độ cao nhất của khí cháy tăng lên.","Độ dày (khe hở - clearance) của vùng squish càng nhỏ thì tốc độ dòng xoáy của hỗn hợp càng cao."],"ex":{"text":"Vùng ép xoáy (squish area) là khe hở giữa mặt dưới nắp máy và đỉnh piston. Gần điểm chết trên, hỗn hợp bị ép ra từ đây và tạo dòng xoáy. Diện tích càng lớn, độ dày (khe hở) càng nhỏ thì dòng xoáy càng nhanh. Dòng xoáy làm ngọn lửa lan truyền nhanh hơn trong kỳ cháy, rút ngắn thời gian cháy và hạn chế nhiệt độ khí cháy cao nhất tăng lên. Đáp án đúng là (3). Câu (3) sai ở chỗ “làm ngọn lửa lan truyền chậm, kéo dài thời gian cháy và thúc đẩy nhiệt độ khí cháy cao nhất tăng lên”. Thực ra, dòng xoáy làm ngọn lửa lan truyền nhanh, rút ngắn thời gian cháy và hạn chế nhiệt độ tăng. Ba câu còn lại đều đúng.","perChoice":["○ Diện tích vùng ép xoáy càng lớn thì tốc độ dòng xoáy càng cao.","○ Vùng ép xoáy dạng nghiêng giúp khí nạp đi vào trơn tru, tạo được dòng xoáy mạnh.","× Làm ngọn lửa lan truyền chậm, kéo dài thời gian cháy và thúc đẩy nhiệt độ khí cháy cao nhất tăng lên → Đúng là: làm ngọn lửa lan truyền nhanh, rút ngắn thời gian cháy và hạn chế nhiệt độ tăng.","○ Độ dày (khe hở) càng nhỏ thì tốc độ dòng xoáy càng cao."]},"terms":[{"ja":"スキッシュ・エリア","t":"vùng ép khí (squish area)"},{"ja":"シリンダ・ヘッド","t":"nắp quy lát (cylinder head)"},{"ja":"渦流","t":"dòng xoáy"},{"ja":"火炎伝播","t":"sự lan truyền ngọn lửa"},{"ja":"混合気","t":"hỗn hợp không khí - nhiên liệu"},{"ja":"燃焼行程","t":"kỳ cháy (kỳ nổ)"}]},"ind":{"stem":"Manakah pernyataan tentang squish area yang dibentuk oleh kepala silinder dan piston berikut ini yang tidak tepat?","choices":["Makin besar luas squish area, makin tinggi kecepatan aliran pusaran (swirl) campuran udara-bahan bakar.","Squish area miring, karena bentuknya miring, membuat udara masuk dari saluran masuk mengalir dengan lancar, dan menghasilkan pusaran yang kuat.","Pusaran yang dihasilkan squish area berfungsi menurunkan kecepatan rambat api pada langkah pembakaran dan memperpanjang waktu pembakaran campuran, sehingga mendorong kenaikan suhu maksimum gas pembakaran.","Makin kecil tebal (celah) squish area, makin tinggi kecepatan aliran pusaran campuran udara-bahan bakar."],"ex":{"text":"Squish area adalah celah antara permukaan bawah kepala silinder dan permukaan atas piston. Dekat TMA, campuran terdorong keluar dari sini dan membentuk pusaran (swirl). Pusaran makin cepat bila luasnya makin besar dan tebalnya (clearance) makin kecil. Pusaran mempercepat perambatan api pada langkah pembakaran, memperpendek waktu pembakaran, dan menekan kenaikan suhu gas pembakaran tertinggi. Jawaban yang benar adalah (3). Pernyataan (3) \"memperlambat perambatan api, memperpanjang waktu pembakaran, dan mendorong kenaikan suhu gas pembakaran tertinggi\" salah. Yang benar: mempercepat perambatan api, memperpendek waktu pembakaran, dan menekan kenaikan suhu. Tiga pernyataan lain benar.","perChoice":["○ Makin luas squish area, makin cepat aliran pusaran.","○ Squish area miring membuat udara masuk lebih lancar dan menghasilkan pusaran yang kuat.","× Memperlambat perambatan api, memperpanjang waktu pembakaran, dan mendorong kenaikan suhu gas pembakaran tertinggi → Yang benar: mempercepat perambatan api, memperpendek waktu pembakaran, dan menekan kenaikan suhu.","○ Makin kecil tebalnya (clearance), makin cepat aliran pusaran."]},"terms":[{"ja":"スキッシュ・エリア","t":"area squish"},{"ja":"シリンダ・ヘッド","t":"kepala silinder (cylinder head)"},{"ja":"渦流","t":"pusaran (swirl)"},{"ja":"火炎伝播","t":"perambatan api"},{"ja":"混合気","t":"campuran udara-bahan bakar"},{"ja":"燃焼行程","t":"langkah usaha (pembakaran)"}]},"si":{"stem":"cylinder head සහ piston මඟින් සෑදෙන squish area පිළිබඳ ප්‍රකාශ අතරින් 【සුදුසු නොවන】 එක කුමක්ද?","choices":["squish area හි area විශාල වන තරමට air-fuel mixture හි swirl ප්‍රවේගය ඉහළ යයි.","ඇල (slanted) squish area එක, ඇල හැඩය නිසා intake passage එකෙන් එන intake air සුමට වී, ශක්තිමත් swirl ඇති කරයි.","squish area මඟින් ඇති වන swirl, combustion stroke හි flame propagation වේගය අඩු කර, air-fuel mixture හි combustion time දිගු කිරීමෙන් maximum combustion gas temperature ඉහළ යාම වේගවත් කිරීමේ කාර්යය කරයි.","squish area හි ඝනකම (clearance) කුඩා වන තරමට air-fuel mixture හි swirl ප්‍රවේගය ඉහළ යයි."],"ex":{"text":"【සුදුසු නොවන】 එක තෝරන ප්‍රශ්නයකි. squish area යනු cylinder head යට මතුපිට සහ piston මුදුන් මතුපිට අතර හිඩැසයි. top dead center අසලදී air-fuel mixture මෙතැනින් තල්ලු වී swirl ඇති වේ. area විශාල වන තරමට සහ ඝනකම (clearance) කුඩා වන තරමට swirl වේගවත්. swirl, combustion stroke හි flame propagation වේගවත් කර, combustion time කෙටි කර maximum combustion gas temperature ඉහළ යාම පාලනය කරයි. නිවැරදි පිළිතුර (3) වේ. (3) හි ‘flame propagation මන්දගාමී කර combustion time දිගු කර maximum combustion gas temperature ඉහළ යාම වේගවත් කරයි’ යන්න වැරදියි. නිවැරදි කරුණ: flame propagation වේගවත් කර, combustion time කෙටි කර උෂ්ණත්වය ඉහළ යාම පාලනය කරයි. අනෙක් 3 නිවැරදි වාක්‍ය වේ.","perChoice":["○ squish area හි area විශාල වන තරමට swirl හි ප්‍රවාහ වේගය වැඩි වේ.","○ ඇල (diagonal) squish area නිසා intake සුමට වී, ප්‍රබල swirl ලැබේ.","× flame propagation මන්දගාමී කර combustion time දිගු කර maximum combustion gas temperature ඉහළ යාම වේගවත් කරයි → නිවැරදි කරුණ: flame propagation වේගවත් කර, combustion time කෙටි කර උෂ්ණත්වය ඉහළ යාම පාලනය කරයි.","○ ඝනකම (clearance) කුඩා වන තරමට swirl හි ප්‍රවාහ වේගය වැඩි වේ."]},"terms":[{"ja":"スキッシュ・エリア","t":"ස්කිෂ් ප්‍රදේශය (squish area)"},{"ja":"シリンダ・ヘッド","t":"සිලින්ඩර හිස (cylinder head)"},{"ja":"渦流","t":"සුළි ප්‍රවාහය (swirl)"},{"ja":"火炎伝播","t":"ගිනිදැල් ප්‍රචාරණය"},{"ja":"混合気","t":"වායු-ඉන්ධන මිශ්‍රණය"},{"ja":"燃焼行程","t":"දහන පහර (power stroke)"}]},"my":{"stem":"ဆလင်ဒါခေါင်း (cylinder head) နှင့် ပစ္စတင် (piston) ဖြင့် ဖွဲ့စည်းထားသော စကွစ်ရှ် ဧရိယာ (squish area) နှင့် ပတ်သက်သော ဖော်ပြချက်အဖြစ် 【မသင့်လျော်သည့်】အချက်မှာ အောက်ပါတို့အနက် မည်သည်နည်း။","choices":["စကွစ်ရှ် ဧရိယာ၏ မျက်နှာပြင် အကျယ် (area) ကြီးလေလေ ရောစပ်လေ (air-fuel mixture) ၏ ဝဲစီးကြောင်း (swirl) စီးနှုန်း မြန်လေလေ ဖြစ်သည်။","စောင်း စကွစ်ရှ် ဧရိယာ (slanted squish area) သည် စောင်းသော ပုံသဏ္ဌာန်ကြောင့် လေဝင်လမ်း (intake port) မှ ဝင်လာသော လေ ချောမွေ့စွာ ဝင်ပြီး ပြင်းထန်သော ဝဲစီးကြောင်း ဖြစ်ပေါ်စေနိုင်သည်။","စကွစ်ရှ် ဧရိယာကြောင့် ဖြစ်သော ဝဲစီးကြောင်းသည် လောင်ကျွမ်း စထရုခ် (combustion stroke) အတွင်း မီးတောက်ပျံ့နှံ့မှု (flame propagation) ၏ အမြန်နှုန်းကို နှေးစေပြီး ရောစပ်လေ၏ လောင်ကျွမ်းချိန်ကို ရှည်စေခြင်းဖြင့် အမြင့်ဆုံး လောင်ကျွမ်းဓာတ်ငွေ့ အပူချိန် တက်ခြင်းကို အားပေးသော တာဝန်ကို ထမ်းဆောင်သည်။","စကွစ်ရှ် ဧရိယာ၏ အထူ (clearance) သေးလေလေ ရောစပ်လေ၏ ဝဲစီးကြောင်း စီးနှုန်း မြန်လေလေ ဖြစ်သည်။"],"ex":{"text":"စကွစ်ရှ် ဧရိယာ (squish area) ဆိုသည်မှာ ဆလင်ဒါ ခေါင်း (cylinder head) ၏ အောက်မျက်နှာပြင်နှင့် ပစ္စတင် ထိပ်မျက်နှာပြင်ကြားရှိ ကြားနေရာ ဖြစ်သည်။ အပေါ်သေမှတ် (TDC) အနီးတွင် ရောစပ်လေ (air-fuel mixture) သည် ဤနေရာမှ ဖိထုတ်ခံရပြီး ဝဲစီးကြောင်း (swirl) ဖြစ်ပေါ်သည်။ ဝဲစီးကြောင်းသည် ဧရိယာ ကြီးလေ၊ အထူ (ကြားအကွာ၊ clearance) ငယ်လေ မြန်လေ ဖြစ်သည်။ ဝဲစီးကြောင်းသည် လောင်ကျွမ်း အဆင့် (combustion stroke) ၏ မီးတောက် ပျံ့နှံ့မှု (flame propagation) ကို မြန်စေပြီး လောင်ကျွမ်းချိန်ကို တိုစေကာ အမြင့်ဆုံး လောင်ကျွမ်းဓာတ်ငွေ့ အပူချိန် မြင့်တက်မှုကို ထိန်းသည်။ အဖြေမှန်မှာ (3) ဖြစ်သည်။ (3) တွင် “မီးတောက် ပျံ့နှံ့မှုကို နှေးစေပြီး လောင်ကျွမ်းချိန်ကို ရှည်စေကာ အမြင့်ဆုံး လောင်ကျွမ်းဓာတ်ငွေ့ အပူချိန် မြင့်တက်မှုကို အားပေးသည်” ဟူသောအချက် မှားသည်။ အမှန်မှာ မီးတောက် ပျံ့နှံ့မှုကို မြန်စေပြီး လောင်ကျွမ်းချိန်ကို တိုစေကာ အပူချိန် မြင့်တက်မှုကို ထိန်းသည်။ ကျန် 3 ခုမှာ မှန်သော စာကြောင်းများ ဖြစ်သည်။","perChoice":["○ စကွစ်ရှ် ဧရိယာ၏ ဧရိယာ ကြီးလေ ဝဲစီးကြောင်း၏ စီးနှုန်း မြန်လေ ဖြစ်သည်။","○ ထောင့်စောင်း စကွစ်ရှ် ဧရိယာ (slanted squish area) သည် စုပ်လေ ဝင်မှု ချောမွေ့ပြီး ပြင်းသော ဝဲစီးကြောင်း ရသည်။","× မီးတောက် ပျံ့နှံ့မှုကို နှေးစေပြီး လောင်ကျွမ်းချိန်ကို ရှည်စေကာ အမြင့်ဆုံး လောင်ကျွမ်းဓာတ်ငွေ့ အပူချိန် မြင့်တက်မှုကို အားပေးသည် → အမှန်မှာ- မီးတောက် ပျံ့နှံ့မှုကို မြန်စေပြီး လောင်ကျွမ်းချိန်ကို တိုစေကာ အပူချိန် မြင့်တက်မှုကို ထိန်းသည်။","○ အထူ (ကြားအကွာ၊ clearance) ငယ်လေ ဝဲစီးကြောင်း၏ စီးနှုန်း မြန်လေ ဖြစ်သည်။"]},"terms":[{"ja":"スキッシュ・エリア","t":"စကွစ်ရှ် ဧရိယာ (squish area)"},{"ja":"シリンダ・ヘッド","t":"ဆလင်ဒါ ခေါင်း (cylinder head)"},{"ja":"渦流","t":"ဝဲလည် စီးကြောင်း (swirl)"},{"ja":"火炎伝播","t":"မီးတောက် ပျံ့နှံ့ခြင်း (flame propagation)"},{"ja":"混合気","t":"လေ-လောင်စာ ရောနှောငွေ့ (air-fuel mixture)"},{"ja":"燃焼行程","t":"လောင်ကျွမ်း စထရုတ် (combustion stroke)"}]}}},{"id":"jaspa-R7.10-D-07","sogo":8,"label":"R7.10 二級ジーゼル No.7","no":7,"stem":"{図|ず}に{示|しめ}すコモンレール{式高圧燃料|しきこうあつねんりょう}{噴射|ふんしゃ}{装置|そうち}のソレノイド{式|しき}インジェクタに{関|かん}する{記述|きじゅつ}として、{不適切|ふてきせつ}なものは{次|つぎ}のうちどれか。","choices":["オリフィスが{開|ひら}くと、{制御|せいぎょ}{室|むろ}の{燃料|ねんりょう}は{次第|しだい}に{流出|りゅうしゅつ}し{制御|せいぎょ}{室|むろ}の{圧力|あつりょく}が{下|さ}がるので、ノズル・ニードル{下面|かめん}に{掛|か}かっていた{圧力|あつりょく}との{圧力差|あつりょくさ}により、ノズル・ニードルが{上昇|じょうしょう}し{燃料|ねんりょう}を{噴射|ふんしゃ}する。","オリフィスが{閉|と}じると、コモンレールからの{高圧燃料|こうあつねんりょう}が、{一気|いっき}に{制御|せいぎょ}{室|むろ}に{流入|りゅうにゅう}することで、ノズル・ニードルが{急激|きゅうげき}に{下降|かこう}し噴孔が{閉|と}じて{噴射|ふんしゃ}が{終了|しゅうりょう}する。","ソレノイド・コイルに{通電|つうでん}が{開始|かいし}されると、{電磁力|でんじりょく}によりバルブはバルブ・スプリングの{力|ちから}に{打|う}ち{勝|か}って{引|ひ}き{上|あ}げられオリフィスが{開|ひら}く。","ソレノイド・コイルへの{通電|つうでん}を{止|と}めると、コモンレールからの{高圧燃料|こうあつねんりょう}が、{一気|いっき}にノズル{室|しつ}に{流入|りゅうにゅう}することで、コマンド・ピストンが{押|お}し{上|あ}げられる。"],"parts":null,"partLabels":null,"answer":4,"fig":"img/jaspa-R7.10-D-07.jpg","exp":{"text":"{図|ず}は{問題|もんだい}{用紙|ようし}を{見|み}ること。ソレノイド{式|しき}インジェクタは{制御|せいぎょ}{室|むろ}の{圧力|あつりょく}でニードルを{動|うご}かす。{無|む}{噴射|ふんしゃ}：オリフィス{閉|へい}。{制御|せいぎょ}{室|むろ}とノズル{室|しつ}が{同|おな}じ{圧力|あつりょく}でも、コマンド・ピストンの{面積|めんせき}が{大|おお}きいのでニードルは{押|お}し{下|さ}げられている。{噴射|ふんしゃ}：{通電|つうでん}→バルブが{上|あ}がりオリフィスが{開|ひら}く→{制御|せいぎょ}{室|むろ}の{燃料|ねんりょう}が{抜|ぬ}けて{圧力|あつりょく}が{下|さ}がる→ニードルが{上|あ}がる。{噴射|ふんしゃ}{終了|しゅうりょう}：{通電|つうでん}を{止|と}める→オリフィスが{閉|と}じる→{高圧燃料|こうあつねんりょう}が{一気|いっき}に{制御|せいぎょ}{室|むろ}に{入|はい}る→ニードルが{急|きゅう}に{下|さ}がる。{正解|せいかい}は(4)。(4)は「{通電|つうでん}を{止|と}めると{高圧燃料|こうあつねんりょう}が{一気|いっき}にノズル{室|しつ}に{流入|りゅうにゅう}し、コマンド・ピストン（ニードル）を{押|お}し{上|あ}げる」が{誤|あやま}り。{正|ただ}しくは{一気|いっき}に{流入|りゅうにゅう}するのは{制御|せいぎょ}{室|むろ}。コマンド・ピストンとニードルは{押|お}し{下|さ}げられ、{噴射|ふんしゃ}が{終|お}わる。ほかの3つは{正|ただ}しい{文|ぶん}。","perChoice":["○ オリフィスが{開|ひら}くと{制御|せいぎょ}{室|むろ}の{燃料|ねんりょう}が{流出|りゅうしゅつ}して{圧力|あつりょく}が{下|さ}がり、ノズル・ニードル{下面|かめん}との{圧力差|あつりょくさ}でニードルが{上|あ}がって{噴射|ふんしゃ}する。","○ オリフィスが{閉|と}じると{高圧燃料|こうあつねんりょう}が{一気|いっき}に{制御|せいぎょ}{室|むろ}に{入|はい}り、ニードルが{急|きゅう}に{下|さ}がって噴孔が{閉|と}じ、{噴射|ふんしゃ}が{終|お}わる。","○ ソレノイド・コイルに{通電|つうでん}すると、バルブがスプリングに{打|う}ち{勝|か}って{引|ひ}き{上|あ}げられ、オリフィスが{開|ひら}き{噴射|ふんしゃ}が{始|はじ}まる。","× {通電|つうでん}を{止|と}めると{高圧燃料|こうあつねんりょう}が{一気|いっき}にノズル{室|しつ}に{流入|りゅうにゅう}し、コマンド・ピストン（ニードル）を{押|お}し{上|あ}げる→{正|ただ}しくは{一気|いっき}に{流入|りゅうにゅう}するのは{制御|せいぎょ}{室|むろ}。コマンド・ピストンとニードルは{押|お}し{下|さ}げられ、{噴射|ふんしゃ}が{終|お}わる。"]},"tr":{"en":{"stem":"Which of the following statements about the solenoid-type injector of the common-rail high-pressure fuel injection system shown in the figure is inappropriate?","choices":["When the orifice opens, the fuel in the control chamber gradually flows out and the pressure in the control chamber drops, so the nozzle needle rises due to the pressure difference with the pressure acting on the lower surface of the nozzle needle, and fuel is injected.","When the orifice closes, high-pressure fuel from the common rail flows into the control chamber all at once, so the nozzle needle descends rapidly, the nozzle holes close, and injection ends.","When current to the solenoid coil starts, the electromagnetic force overcomes the force of the valve spring and pulls up the valve, opening the orifice.","When current to the solenoid coil is stopped, high-pressure fuel from the common rail flows into the nozzle chamber all at once, pushing up the command piston."],"ex":{"text":"See the figure on the question sheet. A solenoid-type injector moves the needle by using the pressure in the control chamber. No injection: the orifice is closed. The control chamber and the nozzle chamber have the same pressure, but the command piston has a larger area, so the needle is pushed down. Injection: current flows → the valve rises and the orifice opens → fuel leaves the control chamber and its pressure drops → the needle rises. End of injection: current stops → the orifice closes → high-pressure fuel quickly enters the control chamber → the needle drops quickly. The correct answer is (4). In (4), \"when the current stops, high-pressure fuel quickly flows into the nozzle chamber and pushes up the command piston (needle)\" is wrong. Correct: the fuel quickly flows into the control chamber. The command piston and the needle are pushed down, and injection ends. The other three are correct statements.","perChoice":["○ When the orifice opens, fuel flows out of the control chamber and its pressure drops. Because of the pressure difference with the lower face of the nozzle needle, the needle rises and fuel is injected.","○ When the orifice closes, high-pressure fuel quickly enters the control chamber. The needle drops quickly, the nozzle holes close, and injection ends.","○ When current flows through the solenoid coil, the valve overcomes the spring and is pulled up. The orifice opens and injection starts.","× When the current stops, high-pressure fuel quickly flows into the nozzle chamber and pushes up the command piston (needle) → Correct: the fuel quickly flows into the control chamber. The command piston and the needle are pushed down, and injection ends."]},"terms":[{"ja":"ソレノイド式インジェクタ","t":"solenoid injector"},{"ja":"オリフィス","t":"orifice"},{"ja":"制御室","t":"control chamber"},{"ja":"ノズル・ニードル","t":"nozzle needle"},{"ja":"コマンド・ピストン","t":"command piston"},{"ja":"噴孔","t":"nozzle hole (spray hole)"}]},"ne":{"stem":"चित्रमा देखाइएको common-rail high-pressure fuel injection system को solenoid-type injector सम्बन्धी कथनहरूमध्ये 【अनुपयुक्त】 कुन हो?","choices":["orifice खुल्दा control chamber को fuel बिस्तारै बाहिर निस्कन्छ र control chamber को pressure घट्छ, त्यसैले nozzle needle को तल्लो सतहमा परिरहेको pressure सँगको pressure फरकले nozzle needle माथि उठ्छ र fuel inject गर्छ।","orifice बन्द हुँदा common rail बाट high-pressure fuel एकैचोटि control chamber मा पस्छ, जसले nozzle needle छिटो तल झर्छ, nozzle hole बन्द हुन्छ र injection समाप्त हुन्छ।","solenoid coil मा energization सुरु हुँदा electromagnetic force ले valve, valve spring को बललाई जितेर माथि तानिन्छ र orifice खुल्छ।","solenoid coil मा energization रोक्दा common rail बाट high-pressure fuel एकैचोटि nozzle chamber मा पसेर command piston माथि धकेलिन्छ।"],"ex":{"text":"चित्र प्रश्नपत्रमा हेर्नुहोस्। सोलेनोइड प्रकारको इन्जेक्टरले नियन्त्रण कक्ष (control chamber) को दबाबले नोजल निडल चलाउँछ। इन्जेक्सन नहुँदा: ओरिफिस (orifice) बन्द हुन्छ। नियन्त्रण कक्ष र नोजल कक्षमा दबाब उस्तै भए पनि, कमान्ड पिस्टन (command piston) को क्षेत्रफल ठूलो भएकाले निडल तल थिचिएको हुन्छ। इन्जेक्सन: करेन्ट दिइन्छ → भल्भ माथि उठ्छ र ओरिफिस खुल्छ → नियन्त्रण कक्षको इन्धन बाहिर निस्कन्छ र दबाब घट्छ → निडल माथि उठ्छ। इन्जेक्सन अन्त्य: करेन्ट रोकिन्छ → ओरिफिस बन्द हुन्छ → उच्चचापको इन्धन एकैचोटि नियन्त्रण कक्षमा पस्छ → निडल छिट्टै तल झर्छ। सही उत्तर (4) हो। (4) मा “करेन्ट रोक्दा उच्चचापको इन्धन एकैचोटि नोजल कक्षमा पसेर कमान्ड पिस्टन (निडल) लाई माथि धकेल्छ” भन्ने कुरा गलत हो। सही कुरा: एकैचोटि पस्ने ठाउँ नियन्त्रण कक्ष हो। कमान्ड पिस्टन र निडल तल थिचिन्छन्, र इन्जेक्सन सकिन्छ। बाँकी 3 वटा कथन सही छन्।","perChoice":["○ ओरिफिस खुल्दा नियन्त्रण कक्षको इन्धन बाहिर निस्केर दबाब घट्छ। नोजल निडलको तल्लो सतहसँगको दबाब फरकले निडल माथि उठ्छ र इन्जेक्ट गर्छ।","○ ओरिफिस बन्द हुँदा उच्चचापको इन्धन एकैचोटि नियन्त्रण कक्षमा पस्छ। निडल छिट्टै तल झर्छ, नोजल प्वाल बन्द हुन्छ, र इन्जेक्सन सकिन्छ।","○ सोलेनोइड कोइलमा करेन्ट दिँदा भल्भले स्प्रिङको बललाई जितेर माथि तानिन्छ, ओरिफिस खुल्छ, र इन्जेक्सन सुरु हुन्छ।","× “करेन्ट रोक्दा उच्चचापको इन्धन एकैचोटि नोजल कक्षमा पसेर कमान्ड पिस्टन (निडल) लाई माथि धकेल्छ” भन्ने गलत हो। → सही कुरा: एकैचोटि पस्ने ठाउँ नियन्त्रण कक्ष हो। कमान्ड पिस्टन र निडल तल थिचिन्छन्, र इन्जेक्सन सकिन्छ।"]},"terms":[{"ja":"ソレノイド式インジェクタ","t":"सोलेनोइड इन्जेक्टर"},{"ja":"オリフィス","t":"ओरिफिस (सानो प्वाल)"},{"ja":"制御室","t":"नियन्त्रण कक्ष"},{"ja":"ノズル・ニードル","t":"नोजल निडल"},{"ja":"コマンド・ピストン","t":"कमान्ड पिस्टन"},{"ja":"噴孔","t":"नोजल प्वाल"}]},"zh":{"stem":"关于图示共轨式高压燃油喷射装置电磁式喷油器的叙述中，不适当的是下列哪一项？","choices":["节流孔打开后，控制室的燃油逐渐流出，控制室压力下降，由于与作用在针阀下面的压力之间的压力差，针阀上升而喷射燃油。","节流孔关闭后，来自共轨的高压燃油一下子流入控制室，针阀急剧下降，喷孔关闭，喷射结束。","开始向电磁线圈通电时，阀在电磁力作用下克服阀弹簧的力被拉起，节流孔打开。","停止向电磁线圈通电时，来自共轨的高压燃油一下子流入喷嘴室，指令活塞被顶起。"],"ex":{"text":"图请看试卷。电磁阀式喷油器是利用控制室的压力来移动针阀的。不喷射时：节流孔（orifice）关闭。即使控制室和喷嘴室的压力相同，由于控制活塞（command piston）的面积较大，针阀仍被压在下方。喷射时：通电→阀被吸起，节流孔打开→控制室的燃油流出，压力下降→针阀上升。喷射结束时：停止通电→节流孔关闭→高压燃油一下子进入控制室→针阀迅速下降。正确答案是(4)。(4)中“停止通电时，高压燃油一下子流入喷嘴室，把控制活塞（针阀）顶起”是错误的。正确的是一下子流入的是控制室。控制活塞和针阀被压下，喷射结束。其他3项是正确的叙述。","perChoice":["○ 节流孔打开后，控制室的燃油流出，压力下降，由于与针阀下面的压力差，针阀上升而喷射。","○ 节流孔关闭后，高压燃油一下子进入控制室，针阀迅速下降，喷孔关闭，喷射结束。","○ 给电磁线圈通电后，阀克服弹簧力被吸起，节流孔打开，开始喷射。","× 停止通电时，高压燃油一下子流入喷嘴室，把控制活塞（针阀）顶起 → 正确说法：一下子流入的是控制室。控制活塞和针阀被压下，喷射结束。"]},"terms":[{"ja":"ソレノイド式インジェクタ","t":"电磁式喷油器"},{"ja":"オリフィス","t":"节流孔"},{"ja":"制御室","t":"控制室"},{"ja":"ノズル・ニードル","t":"喷油嘴针阀"},{"ja":"コマンド・ピストン","t":"控制活塞"},{"ja":"噴孔","t":"喷孔"}]},"vi":{"stem":"Về kim phun (injector) kiểu điện từ (solenoid) của hệ thống phun nhiên liệu áp suất cao kiểu common rail như trong hình, câu nào sau đây là KHÔNG phù hợp?","choices":["Khi lỗ tiết lưu (orifice) mở ra, nhiên liệu trong buồng điều khiển chảy ra dần và áp suất buồng điều khiển giảm xuống. Do chênh lệch với áp suất đang tác dụng lên mặt dưới kim vòi phun (nozzle needle), kim vòi phun đi lên và nhiên liệu được phun ra.","Khi lỗ tiết lưu đóng lại, nhiên liệu áp suất cao từ ống common rail chảy ồ ạt vào buồng điều khiển, làm kim vòi phun đi xuống thật nhanh, lỗ phun đóng lại và việc phun nhiên liệu kết thúc.","Khi bắt đầu cấp điện cho cuộn dây điện từ (solenoid coil), lực điện từ làm van thắng lực của lò xo van (valve spring) và bị kéo lên, lỗ tiết lưu (orifice) mở ra.","Khi ngừng cấp điện cho cuộn dây điện từ, nhiên liệu áp suất cao từ ống common rail chảy ồ ạt vào buồng vòi phun (nozzle chamber), làm piston điều khiển (command piston) bị đẩy lên."],"ex":{"text":"Xem hình trong đề thi. Kim phun kiểu van điện từ (solenoid) dùng áp suất trong buồng điều khiển để di chuyển ty kim (needle). Không phun: lỗ tiết lưu (orifice) đóng. Dù buồng điều khiển và buồng vòi phun có cùng áp suất, nhưng vì diện tích của piston điều khiển (command piston) lớn hơn nên ty kim bị đẩy xuống. Phun: cấp điện → van được nâng lên, lỗ tiết lưu mở → nhiên liệu trong buồng điều khiển thoát ra, áp suất giảm → ty kim được nâng lên. Kết thúc phun: ngắt điện → lỗ tiết lưu đóng → nhiên liệu cao áp tràn vào buồng điều khiển cùng một lúc → ty kim hạ xuống đột ngột. Đáp án đúng là (4). Câu (4) sai ở chỗ “khi ngắt điện, nhiên liệu cao áp tràn vào buồng vòi phun cùng một lúc và đẩy piston điều khiển (ty kim) lên”. Đúng là: nơi nhiên liệu tràn vào cùng một lúc là buồng điều khiển. Piston điều khiển và ty kim bị đẩy xuống, kết thúc phun. 3 câu còn lại đều đúng.","perChoice":["○ Lỗ tiết lưu mở thì nhiên liệu trong buồng điều khiển thoát ra, áp suất giảm; do chênh lệch áp suất với mặt dưới của ty kim phun (nozzle needle), ty kim được nâng lên và phun nhiên liệu.","○ Lỗ tiết lưu đóng thì nhiên liệu cao áp tràn vào buồng điều khiển cùng một lúc, ty kim hạ xuống đột ngột, lỗ phun đóng lại và kết thúc phun.","○ Khi cấp điện cho cuộn dây điện từ (solenoid coil), van thắng lực lò xo và được kéo lên, lỗ tiết lưu mở và bắt đầu phun.","× Khi ngắt điện, nhiên liệu cao áp tràn vào buồng vòi phun cùng một lúc và đẩy piston điều khiển (ty kim) lên → Đúng là: nơi nhiên liệu tràn vào cùng một lúc là buồng điều khiển. Piston điều khiển và ty kim bị đẩy xuống, kết thúc phun."]},"terms":[{"ja":"ソレノイド式インジェクタ","t":"kim phun kiểu van điện từ (solenoid-type injector)"},{"ja":"オリフィス","t":"lỗ tiết lưu (orifice)"},{"ja":"制御室","t":"buồng điều khiển (control chamber)"},{"ja":"ノズル・ニードル","t":"kim van của vòi phun (nozzle needle)"},{"ja":"コマンド・ピストン","t":"pít-tông điều khiển (command piston)"},{"ja":"噴孔","t":"lỗ phun"}]},"ind":{"stem":"Manakah pernyataan tentang injektor tipe solenoid pada sistem injeksi bahan bakar tekanan tinggi common rail di gambar berikut ini yang tidak tepat?","choices":["Saat orifice membuka, bahan bakar di ruang kontrol sedikit demi sedikit mengalir keluar dan tekanan di ruang kontrol turun, sehingga jarum nosel naik karena perbedaan tekanan dengan tekanan yang bekerja pada permukaan bawah jarum nosel, dan bahan bakar diinjeksikan.","Saat orifice menutup, bahan bakar tekanan tinggi dari common rail mengalir sekaligus ke ruang kontrol, sehingga jarum nosel turun dengan cepat, lubang nosel tertutup, dan injeksi berakhir.","Saat arus ke kumparan solenoid mulai mengalir, gaya elektromagnet mengalahkan gaya pegas katup dan menarik katup ke atas, sehingga orifice membuka.","Saat arus ke kumparan solenoid dihentikan, bahan bakar tekanan tinggi dari common rail mengalir sekaligus ke ruang nosel dan mendorong command piston ke atas."],"ex":{"text":"Lihat gambar di lembar soal. Injektor tipe solenoid menggerakkan jarum dengan tekanan di ruang kendali. Tanpa injeksi: orifis tertutup. Walaupun tekanan di ruang kendali dan ruang nozel sama, luas command piston lebih besar, jadi jarum tertekan ke bawah. Injeksi: dialiri arus, katup naik dan orifis terbuka, bahan bakar di ruang kendali keluar, tekanan turun, dan jarum naik. Injeksi berhenti: arus dihentikan, orifis menutup, bahan bakar bertekanan tinggi langsung masuk ke ruang kendali, dan jarum turun cepat. Jawaban yang benar adalah (4). Pernyataan (4) \"bila arus dihentikan, bahan bakar bertekanan tinggi langsung masuk ke ruang nozel dan mendorong command piston (jarum) ke atas\" salah. Yang benar: yang dimasuki langsung adalah ruang kendali. Command piston dan jarum tertekan ke bawah, dan injeksi berhenti. Tiga pernyataan lain benar.","perChoice":["○ Saat orifis terbuka, bahan bakar di ruang kendali keluar dan tekanannya turun, lalu selisih tekanan dengan sisi bawah jarum nozel mengangkat jarum sehingga terjadi injeksi.","○ Saat orifis menutup, bahan bakar bertekanan tinggi langsung masuk ke ruang kendali, jarum turun cepat, lubang nozel menutup, dan injeksi berhenti.","○ Bila kumparan solenoid dialiri arus, katup terangkat melawan pegas, orifis terbuka, dan injeksi dimulai.","× Bila arus dihentikan, bahan bakar bertekanan tinggi langsung masuk ke ruang nozel dan mendorong command piston (jarum) ke atas → Yang benar: yang dimasuki langsung adalah ruang kendali. Command piston dan jarum tertekan ke bawah, dan injeksi berhenti."]},"terms":[{"ja":"ソレノイド式インジェクタ","t":"injektor tipe solenoid"},{"ja":"オリフィス","t":"orifis (lubang kecil)"},{"ja":"制御室","t":"ruang kontrol"},{"ja":"ノズル・ニードル","t":"jarum nosel"},{"ja":"コマンド・ピストン","t":"piston perintah (command piston)"},{"ja":"噴孔","t":"lubang nosel"}]},"si":{"stem":"රූපයේ දැක්වෙන common-rail high-pressure fuel injection system එකේ solenoid-type injector පිළිබඳ ප්‍රකාශ අතරින් 【සුදුසු නොවන】 එක කුමක්ද?","choices":["orifice එක විවෘත වූ විට, control chamber එකේ fuel ක්‍රමයෙන් පිටතට ගලා යමින් control chamber එකේ pressure අඩු වන නිසා, nozzle needle එකේ පහළ මුහුණතට යෙදී තිබූ pressure සමඟ ඇති pressure වෙනස නිසා nozzle needle එක ඉහළ ගොස් fuel injection කරයි.","orifice එක වැසුණු විට, common rail එකෙන් එන high-pressure fuel එකවරම control chamber එකට ගලා ඒමෙන්, nozzle needle එක වේගයෙන් පහළට ගොස් nozzle hole එක වැසී injection අවසන් වේ.","solenoid coil එකට energization ආරම්භ වූ විට, electromagnetic force මඟින් valve එක valve spring හි බලය පරදවා ඉහළට ඇදී orifice එක විවෘත වේ.","solenoid coil එකට energization නැවැත්වූ විට, common rail එකෙන් එන high-pressure fuel එකවරම nozzle chamber එකට ගලා ඒමෙන්, command piston එක ඉහළට තල්ලු වේ."],"ex":{"text":"රූපය සඳහා ප්‍රශ්න පත්‍රය බලන්න. සොලෙනොයිඩ් වර්ගයේ ඉන්ජෙක්ටරය (solenoid injector) පාලන කුටීරයේ (control chamber) පීඩනයෙන් නීඩලය (needle) චලනය කරයි. විදීම නැති විට: ඕරිෆිසය (orifice) වසා ඇත. පාලන කුටීරය සහ නොසල් කුටීරය (nozzle chamber) සමාන පීඩනයේ වුවත්, කමාන්ඩ් පිස්ටනයේ (command piston) වර්ගඵලය විශාල නිසා නීඩලය පහළට තද කර ඇත. විදීම: විදුලිය සැපයීම → වෑල්ව් එක ඉහළට යයි, ඕරිෆිසය විවෘත වේ → පාලන කුටීරයේ ඉන්ධනය පිට වී පීඩනය අඩු වේ → නීඩලය ඉහළට යයි. විදීම අවසානය: විදුලිය නවත්වයි → ඕරිෆිසය වැසේ → අධි පීඩන ඉන්ධනය එකවර පාලන කුටීරයට ඇතුළු වේ → නීඩලය හදිසියේ පහළට යයි. නිවැරදි පිළිතුර (4) වේ. (4) හි 'විදුලිය නැවැත්වූ විට අධි පීඩන ඉන්ධනය එකවර නොසල් කුටීරයට ඇතුළු වී, කමාන්ඩ් පිස්ටනය (නීඩලය) ඉහළට තල්ලු කරයි' යන්න වැරදියි. නිවැරදිව, එකවර ඇතුළු වන්නේ පාලන කුටීරයටයි. කමාන්ඩ් පිස්ටනය සහ නීඩලය පහළට තල්ලු වී, විදීම අවසන් වේ. අනෙක් 3 නිවැරදි ප්‍රකාශ වේ.","perChoice":["○ ඕරිෆිසය විවෘත වූ විට පාලන කුටීරයේ ඉන්ධනය පිට වී පීඩනය අඩු වේ; නොසල් නීඩලයේ යට මතුපිට සමඟ ඇති පීඩන වෙනස නිසා නීඩලය ඉහළට ගොස් විදීම සිදු වේ.","○ ඕරිෆිසය වැසුණු විට අධි පීඩන ඉන්ධනය එකවර පාලන කුටීරයට ඇතුළු වී, නීඩලය හදිසියේ පහළට ගොස් විදින සිදුර (nozzle hole) වැසී, විදීම අවසන් වේ.","○ සොලෙනොයිඩ් දඟරයට (solenoid coil) විදුලිය සැපයූ විට, වෑල්ව් එක ස්ප්‍රිංගය පරදවා ඉහළට ඇදී, ඕරිෆිසය විවෘත වී විදීම ආරම්භ වේ.","× විදුලිය නැවැත්වූ විට අධි පීඩන ඉන්ධනය එකවර නොසල් කුටීරයට ඇතුළු වී, කමාන්ඩ් පිස්ටනය (නීඩලය) ඉහළට තල්ලු කරයි → නිවැරදි කරුණ: එකවර ඇතුළු වන්නේ පාලන කුටීරයටයි. කමාන්ඩ් පිස්ටනය සහ නීඩලය පහළට තල්ලු වී, විදීම අවසන් වේ."]},"terms":[{"ja":"ソレノイド式インジェクタ","t":"සොලෙනොයිඩ් ඉන්ජෙක්ටරය"},{"ja":"オリフィス","t":"කුඩා සිදුර (orifice)"},{"ja":"制御室","t":"පාලන කුටීරය"},{"ja":"ノズル・ニードル","t":"තුණ්ඩ ඉඳිකටුව (nozzle needle)"},{"ja":"コマンド・ピストン","t":"කමාන්ඩ් පිස්ටනය (command piston)"},{"ja":"噴孔","t":"විදුම් සිදුර (nozzle hole)"}]},"my":{"stem":"ပုံတွင် ပြထားသော ကွန်မွန်ရေးလ် အမျိုးအစား ဖိအားမြင့် လောင်စာ ထိုးသွင်းစနစ် (common rail system) ၏ ဆိုလီနွိုက် အမျိုးအစား အင်ဂျက်တာ (solenoid injector) နှင့် ပတ်သက်သော ဖော်ပြချက်အဖြစ် 【မသင့်လျော်သည့်】အချက်မှာ အောက်ပါတို့အနက် မည်သည်နည်း။","choices":["အော်ရီဖစ် (orifice) ပွင့်သောအခါ ထိန်းချုပ်ခန်း (control chamber) ထဲရှိ လောင်စာ တဖြည်းဖြည်း စီးထွက်ပြီး ထိန်းချုပ်ခန်း၏ ဖိအား ကျသွားသောကြောင့် နော်ဇယ် နီဒယ် (nozzle needle) ၏ အောက်မျက်နှာတွင် ကျရောက်နေသော ဖိအားနှင့် ဖိအား ကွာခြားလာပြီး နော်ဇယ် နီဒယ် အပေါ်သို့ တက်ကာ လောင်စာကို ထိုးသွင်းသည်။","အော်ရီဖစ် ပိတ်သောအခါ ကွန်မွန်ရေးလ် (common rail) မှ ဖိအားမြင့် လောင်စာသည် ထိန်းချုပ်ခန်းထဲသို့ ချက်ချင်း စီးဝင်သောကြောင့် နော်ဇယ် နီဒယ် ရုတ်တရက် အောက်သို့ ဆင်းပြီး ထိုးပေါက် (nozzle hole) ပိတ်သွားကာ ထိုးသွင်းမှု ပြီးဆုံးသည်။","ဆိုလီနွိုက် ကွိုင် (solenoid coil) သို့ လျှပ်စီး စပေးသောအခါ လျှပ်သံလိုက်အားကြောင့် ဗားလ်ဗ် (valve) သည် ဗားလ်ဗ် စပရင် (valve spring) ၏ အားကို ကျော်လွန်၍ အပေါ်သို့ ဆွဲတင်ခံရပြီး အော်ရီဖစ် ပွင့်သည်။","ဆိုလီနွိုက် ကွိုင်သို့ လျှပ်စီး ပေးခြင်းကို ရပ်လိုက်သောအခါ ကွန်မွန်ရေးလ်မှ ဖိအားမြင့် လောင်စာသည် နော်ဇယ် ခန်း (nozzle chamber) ထဲသို့ ချက်ချင်း စီးဝင်သောကြောင့် ကွန်မန်း ပစ္စတင် (command piston) သည် အပေါ်သို့ တွန်းတင်ခံရသည်။"],"ex":{"text":"ပုံကို မေးခွန်းစာရွက်တွင် ကြည့်ပါ။ Solenoid-type injector သည် control chamber ၏ pressure ဖြင့် needle ကို လှုပ်ရှားစေသည်။ မဖြန်းချိန်- orifice ပိတ်။ Control chamber နှင့် nozzle chamber pressure တူသော်လည်း command piston ၏ ဧရိယာ ကြီးသောကြောင့် needle ကို အောက်သို့ ဖိထားသည်။ ဖြန်းချိန်- energization → valve တက် → orifice ပွင့် → control chamber ၏ fuel ထွက်ပြီး pressure ကျ → needle တက်။ ဖြန်းခြင်း ပြီးဆုံးချိန်- energization ရပ် → orifice ပိတ် → high-pressure fuel သည် control chamber ထဲသို့ တစ်ပြိုင်နက် ဝင် → needle ရုတ်တရက် ကျ။ အဖြေမှန်မှာ (4) ဖြစ်သည်။ (4) တွင် 「energization ရပ်လျှင် high-pressure fuel သည် nozzle chamber ထဲသို့ တစ်ပြိုင်နက် ဝင်ပြီး command piston (needle) ကို အပေါ်သို့ တွန်းတင်သည်」 ဆိုသည်မှာ မှားသည်။ အမှန်မှာ တစ်ပြိုင်နက် ဝင်သည်မှာ control chamber ဖြစ်သည်။ Command piston နှင့် needle ကို အောက်သို့ ဖိချပြီး ဖြန်းခြင်း ပြီးဆုံးသည်။ ကျန် 3 ခုမှာ မှန်ကန်သော စာကြောင်းများ ဖြစ်သည်။","perChoice":["○ Orifice ပွင့်လျှင် control chamber ၏ fuel ထွက်ပြီး pressure ကျကာ nozzle needle အောက်မျက်နှာနှင့် pressure ကွာခြားမှုကြောင့် needle တက်ပြီး ဖြန်းသည်။","○ Orifice ပိတ်လျှင် high-pressure fuel သည် control chamber ထဲသို့ တစ်ပြိုင်နက် ဝင်ပြီး needle ရုတ်တရက် ကျကာ nozzle hole ပိတ်ပြီး ဖြန်းခြင်း ပြီးဆုံးသည်။","○ Solenoid coil ကို energization လုပ်လျှင် valve သည် spring ကို အနိုင်ယူပြီး အပေါ်သို့ ဆွဲတင်ခံရကာ orifice ပွင့်ပြီး ဖြန်းခြင်း စတင်သည်။","× Energization ရပ်လျှင် high-pressure fuel သည် nozzle chamber ထဲသို့ တစ်ပြိုင်နက် ဝင်ပြီး command piston (needle) ကို အပေါ်သို့ တွန်းတင်သည် → အမှန်မှာ- တစ်ပြိုင်နက် ဝင်သည်မှာ control chamber ဖြစ်သည်။ Command piston နှင့် needle ကို အောက်သို့ ဖိချပြီး ဖြန်းခြင်း ပြီးဆုံးသည်။"]},"terms":[{"ja":"ソレノイド式インジェクタ","t":"ဆိုလီနွိုက် အမျိုးအစား အင်ဂျက်တာ (solenoid-type injector)"},{"ja":"オリフィス","t":"အပေါက်ကျဉ်း (orifice)"},{"ja":"制御室","t":"ထိန်းချုပ်ခန်း (control chamber)"},{"ja":"ノズル・ニードル","t":"နော်ဇယ် အပ် (nozzle needle)"},{"ja":"コマンド・ピストン","t":"ကွန်မန်း ပစ္စတင် (command piston)"},{"ja":"噴孔","t":"လောင်စာ ဖြန်းထွက်ပေါက် (nozzle hole)"}]}}},{"id":"jaspa-R7.10-D-24","sogo":19,"label":"R7.10 二級ジーゼル No.24","no":24,"stem":"{電気|でんき}{空気式|くうきしき}エキゾースト・ブレーキに{関|かん}する{記述|きじゅつ}として、{不適切|ふてきせつ}なものは{次|つぎ}のうちどれか。","choices":["コントロール・シリンダは、{負圧|ふあつ}によってエキゾースト・ブレーキ・バルブの{開閉|かいへい}を{行|おこな}う。","マグネティック・バルブは、コントロール・シリンダへの{圧縮|あっしゅく}エアの{供給|きょうきゅう}{及|およ}び{排出|はいしゅつ}を{行|おこな}う。","エキゾースト・ブレーキ{作動|さどう}{時|とき}には、エキゾースト・ブレーキ・スイッチ、アクセル・スイッチ{及|およ}びクラッチ・スイッチは ONになっている。","エキゾースト・ブレーキ・カット・リレーは、{通常時|つうじょうじ}は ONとなって{回路|かいろ}が{接続|せつぞく}されているが、ABS {作動|さどう}{時|とき}には、ブレーキECUにより OFFとなって{回路|かいろ}が{断|た}たれる。"],"parts":null,"partLabels":null,"answer":1,"fig":null,"exp":{"text":"{電気|でんき}{空気式|くうきしき}エキゾースト・ブレーキ。エキゾースト・パイプ{内|ない}のバルブを{閉|と}じて{排気|はいき}{抵抗|ていこう}を{増|ふ}やし、エンジン・ブレーキを{強|つよ}くする。{制御|せいぎょ}は{電気|でんき}、{作動|さどう}は{圧縮|あっしゅく}エア。マグネティック・バルブがコントロール・シリンダへの{圧縮|あっしゅく}エアを{供給|きょうきゅう}・{排出|はいしゅつ}し、コントロール・シリンダがバルブを{開閉|かいへい}する。{作動|さどう}させるには、クラッチ・スイッチとアクセル・スイッチ、それにエキゾースト・ブレーキ・スイッチの3つがすべてONであり、カット・リレー（{通常|つうじょう}ON、ABS{作動|さどう}{時|じ}OFF）を{通|とお}って{電源|でんげん}が{来|く}ることが{必要|ひつよう}。{回転速度|かいてんそくど}が{規定値|きていち}{以下|いか}になるとECUが{解除|かいじょ}する。{正解|せいかい}は(1)。(1)が{誤|あやま}りの{文|ぶん}。ほかの3つは{正|ただ}しい{文|ぶん}。どこが{違|ちが}うかは{選択肢|せんたくし}ごとの{説明|せつめい}を{見|み}ること。","perChoice":["× {負圧|ふあつ}で{開閉|かいへい}→{正|ただ}しくは{圧縮|あっしゅく}エアで{開閉|かいへい}する（{電気|でんき}{空気式|くうきしき}）。{負圧|ふあつ}を{使|つか}うのは{電気|でんき}{負圧式|ふあつしき}。","○ マグネティック・バルブはエンジンECUの{信号|しんごう}で、コントロール・シリンダへの{圧縮|あっしゅく}エアの{供給|きょうきゅう}・{排出|はいしゅつ}を{行|おこな}う。","○ {作動|さどう}{時|とき}はエキゾースト・ブレーキ・スイッチ、アクセル・スイッチ（ペダルを{離|はな}すとON）、クラッチ・スイッチ（ペダルを{離|はな}すとON）が{全部|ぜんぶ}ON。","○ エキゾースト・ブレーキ・カット・リレーは{通常|つうじょう}ONで、ABS{作動|さどう}{時|とき}などにブレーキECUがOFFにして{回路|かいろ}を{切|き}る。"]},"tr":{"en":{"stem":"Which of the following statements about the electro-pneumatic exhaust brake is inappropriate?","choices":["The control cylinder opens and closes the exhaust brake valve using negative pressure.","The magnetic valve supplies compressed air to, and discharges it from, the control cylinder.","When the exhaust brake is operating, the exhaust brake switch, accelerator switch, and clutch switch are ON.","The exhaust brake cut relay is normally ON with the circuit connected, but when the ABS operates, it is turned OFF by the brake ECU and the circuit is cut."],"ex":{"text":"Electro-pneumatic exhaust brake. It closes a valve in the exhaust pipe to increase exhaust resistance and make the engine brake stronger. It is controlled by electricity and operated by compressed air. The magnetic valve supplies and releases compressed air to the control cylinder, and the control cylinder opens and closes the valve. To operate it, all three switches, the clutch switch, the accelerator switch, and the exhaust brake switch, must be ON, and power must come through the cut relay (normally ON, OFF when the ABS works). When the engine speed drops below the specified value, the ECU cancels it. The correct answer is (1). (1) is the wrong statement. The other three are correct. See the explanation for each choice to find the difference.","perChoice":["× Opens and closes by negative pressure → Correct: it opens and closes by compressed air (electro-pneumatic type). The electro-vacuum type uses negative pressure.","○ The magnetic valve supplies and releases compressed air to the control cylinder by signals from the engine ECU.","○ When it works, the exhaust brake switch, the accelerator switch (ON when the pedal is released), and the clutch switch (ON when the pedal is released) are all ON.","○ The exhaust brake cut relay is normally ON. When the ABS works, for example, the brake ECU turns it OFF and cuts the circuit."]},"terms":[{"ja":"電気空気式エキゾースト・ブレーキ","t":"electro-pneumatic exhaust brake"},{"ja":"コントロール・シリンダ","t":"control cylinder"},{"ja":"マグネティック・バルブ","t":"magnetic valve"},{"ja":"エキゾースト・ブレーキ・カット・リレー","t":"exhaust brake cut relay"},{"ja":"エキゾースト・ブレーキ・スイッチ","t":"exhaust brake switch"},{"ja":"負圧","t":"negative pressure (vacuum)"}]},"ne":{"stem":"electro-pneumatic exhaust brake सम्बन्धी कथनमध्ये 【अनुपयुक्त】 कुन हो?","choices":["control cylinder ले negative pressure द्वारा exhaust brake valve खोल्ने र बन्द गर्ने काम गर्छ।","magnetic valve ले control cylinder मा compressed air पठाउने र निकाल्ने काम गर्छ।","exhaust brake चलिरहेको बेला exhaust brake switch, accelerator switch र clutch switch ON अवस्थामा हुन्छन्।","exhaust brake cut relay सामान्य बेला ON भएर circuit जोडिएको हुन्छ, तर ABS चल्दा brake ECU ले OFF गरेर circuit काटिन्छ।"],"ex":{"text":"electro-pneumatic exhaust brake। exhaust pipe भित्रको valve बन्द गरेर exhaust resistance बढाउँछ र engine braking बलियो बनाउँछ। नियन्त्रण बिजुलीले, चलाउने काम compressed air ले। magnetic valve ले control cylinder मा compressed air दिने र निकाल्ने गर्छ, र control cylinder ले valve खोल्ने र बन्द गर्ने गर्छ। चलाउन clutch switch, accelerator switch र exhaust brake switch तीनै ON हुनुपर्छ, र cut relay (साधारणतया ON, ABS काम गर्दा OFF) हुँदै power आउनुपर्छ। rotation speed specified value भन्दा कम भए ECU ले बन्द गर्छ। सही उत्तर (1) हो। (1) गलत वाक्य हो (【अनुपयुक्त】)। अरू 3 वटा सही वाक्य हुन्। कहाँ फरक छ भनेर हरेक विकल्पको व्याख्या हेर्नुहोस्।","perChoice":["× negative pressure ले खोल्छ र बन्द गर्छ → सही कुरा: compressed air ले खोल्छ र बन्द गर्छ (electro-pneumatic)। negative pressure प्रयोग गर्ने भनेको electro-vacuum प्रकार हो।","○ magnetic valve ले engine ECU को signal ले control cylinder मा compressed air पठाउने र निकाल्ने काम गर्छ।","○ चल्ने बेलामा exhaust brake switch, accelerator switch (pedal छोड्दा ON), clutch switch (pedal छोड्दा ON) सबै ON हुन्छन्।","○ exhaust brake cut relay सामान्य अवस्थामा ON हुन्छ, ABS चल्दा आदिमा brake ECU ले OFF गरेर circuit काट्छ।"]},"terms":[{"ja":"電気空気式エキゾースト・ブレーキ","t":"विद्युत-वायु एग्जस्ट ब्रेक"},{"ja":"コントロール・シリンダ","t":"कन्ट्रोल सिलिन्डर"},{"ja":"マグネティック・バルブ","t":"म्याग्नेटिक भल्भ"},{"ja":"エキゾースト・ブレーキ・カット・リレー","t":"एग्जस्ट ब्रेक कट रिले"},{"ja":"エキゾースト・ブレーキ・スイッチ","t":"एग्जस्ट ब्रेक स्विच"},{"ja":"負圧","t":"ऋणात्मक दबाब (भ्याकुम)"}]},"zh":{"stem":"关于电气-气压式排气制动器的叙述中，不适当的是下列哪一项？","choices":["控制缸利用负压进行排气制动阀的开闭。","电磁阀对控制缸进行压缩空气的供给及排出。","排气制动器工作时，排气制动开关、加速踏板开关及离合器开关处于ON状态。","排气制动切断继电器平时为ON，电路接通，但在ABS工作时，由制动ECU使其变为OFF，电路断开。"],"ex":{"text":"本题选【不恰当】的说法。电控气动式排气制动。关闭排气管里的阀门，增加排气阻力，使发动机制动更强。控制用电，动作用压缩空气。电磁阀给控制气缸供给或排出压缩空气，控制气缸开关阀门。要让它工作，离合器开关、加速踏板开关和排气制动开关3个都必须是ON，并且电源要经过切断继电器（cut relay，平时ON，ABS工作时OFF）送来。转速降到规定值以下时，ECU解除排气制动。正确答案是(1)。(1)是错误的说法，另外3个是正确的说法。哪里不对，请看每个选项的说明。","perChoice":["× 用负压开关 → 正确说法：用压缩空气开关（电控气动式）。用负压的是电控真空式。","○ 电磁阀根据发动机ECU的信号，给控制气缸供给或排出压缩空气。","○ 工作时，排气制动开关、加速踏板开关（松开踏板时ON）、离合器开关（松开踏板时ON）全部是ON。","○ 排气制动切断继电器平时是ON，ABS工作时等情况下由制动ECU置为OFF，切断电路。"]},"terms":[{"ja":"電気空気式エキゾースト・ブレーキ","t":"电控气动排气制动"},{"ja":"コントロール・シリンダ","t":"控制气缸"},{"ja":"マグネティック・バルブ","t":"电磁阀"},{"ja":"エキゾースト・ブレーキ・カット・リレー","t":"排气制动切断继电器"},{"ja":"エキゾースト・ブレーキ・スイッチ","t":"排气制动开关"},{"ja":"負圧","t":"负压"}]},"vi":{"stem":"Về phanh khí xả (exhaust brake) kiểu điện - khí nén, câu nào sau đây là KHÔNG phù hợp?","choices":["Xi lanh điều khiển (control cylinder) đóng mở van phanh khí xả (exhaust brake valve) bằng áp suất âm (chân không).","Van điện từ (magnetic valve) cấp và xả khí nén cho xi lanh điều khiển.","Khi phanh khí xả hoạt động, công tắc phanh khí xả, công tắc bàn đạp ga (accelerator switch) và công tắc ly hợp (clutch switch) đều ở trạng thái ON.","Rơ-le ngắt phanh khí xả (exhaust brake cut relay) bình thường ở trạng thái ON và mạch được nối, nhưng khi ABS hoạt động thì ECU phanh chuyển nó sang OFF và mạch bị ngắt."],"ex":{"text":"Phanh khí xả kiểu điện khí nén. Đóng van trong ống xả để tăng sức cản khí xả và tăng phanh động cơ. Điều khiển bằng điện, vận hành bằng khí nén. Van điện từ cấp và xả khí nén cho xi lanh điều khiển, xi lanh điều khiển đóng mở van. Để hoạt động, cần cả 3 công tắc: công tắc ly hợp, công tắc chân ga và công tắc phanh khí xả đều ON, và nguồn điện đi qua rơ-le ngắt (bình thường ON, khi ABS hoạt động thì OFF). Khi tốc độ quay xuống dưới giá trị quy định thì ECU hủy. Đáp án đúng là (1). Câu (1) là câu sai. Ba câu còn lại là câu đúng. Chỗ khác nhau xem phần giải thích từng lựa chọn.","perChoice":["× Đóng mở bằng áp suất âm → Đúng là: đóng mở bằng khí nén (kiểu điện khí nén). Kiểu dùng áp suất âm là kiểu điện chân không.","○ Van điện từ theo tín hiệu của ECU động cơ cấp và xả khí nén cho xi lanh điều khiển.","○ Khi hoạt động, công tắc phanh khí xả, công tắc chân ga (nhả bàn đạp thì ON), công tắc ly hợp (nhả bàn đạp thì ON) đều ON.","○ Rơ-le ngắt phanh khí xả bình thường ON, khi ABS hoạt động v.v. thì ECU phanh chuyển OFF để ngắt mạch."]},"terms":[{"ja":"電気空気式エキゾースト・ブレーキ","t":"phanh khí xả kiểu điện - khí nén (electro-pneumatic exhaust brake)"},{"ja":"コントロール・シリンダ","t":"xi lanh điều khiển (control cylinder)"},{"ja":"マグネティック・バルブ","t":"van điện từ (magnetic valve)"},{"ja":"エキゾースト・ブレーキ・カット・リレー","t":"rơ-le ngắt phanh khí xả (exhaust brake cut relay)"},{"ja":"エキゾースト・ブレーキ・スイッチ","t":"công tắc phanh khí xả (exhaust brake switch)"},{"ja":"負圧","t":"áp suất âm (chân không)"}]},"ind":{"stem":"Manakah pernyataan tentang rem gas buang (exhaust brake) tipe elektro-pneumatik berikut ini yang tidak tepat?","choices":["Control cylinder membuka dan menutup katup exhaust brake dengan tekanan negatif (vakum).","Katup magnet (magnetic valve) memasok udara bertekanan ke control cylinder dan membuangnya.","Saat exhaust brake bekerja, sakelar exhaust brake, sakelar pedal gas, dan sakelar kopling dalam keadaan ON.","Relai pemutus exhaust brake biasanya ON dengan rangkaian tersambung, tetapi saat ABS bekerja, relai dibuat OFF oleh ECU rem dan rangkaian terputus."],"ex":{"text":"Rem buang elektro-pneumatik. Katup di dalam pipa buang ditutup untuk menaikkan hambatan gas buang sehingga rem mesin menjadi lebih kuat. Kendalinya listrik, penggeraknya udara tekan. Katup magnetik memasok dan membuang udara tekan ke silinder kendali, dan silinder kendali membuka-menutup katup. Agar bekerja, ketiga sakelar (sakelar kopling, sakelar gas, dan sakelar rem buang) harus ON semua dan daya harus datang lewat relai pemutus (cut relay) (biasanya ON, OFF saat ABS bekerja). Bila putaran turun di bawah nilai ketentuan, ECU melepasnya. Jawaban yang benar adalah (1). Pernyataan (1) yang salah. Tiga pernyataan lain benar. Lihat penjelasan tiap pilihan untuk tahu letak salahnya.","perChoice":["× Dibuka-tutup dengan tekanan negatif → Yang benar: dibuka-tutup dengan udara tekan (tipe elektro-pneumatik). Tekanan negatif dipakai pada tipe elektro-vakum.","○ Katup magnetik, atas sinyal ECU mesin, memasok dan membuang udara tekan ke silinder kendali.","○ Saat bekerja, sakelar rem buang, sakelar gas (ON bila pedal dilepas), dan sakelar kopling (ON bila pedal dilepas) semuanya ON.","○ Relai pemutus rem buang biasanya ON, dan ECU rem menjadikannya OFF untuk memutus rangkaian, misalnya saat ABS bekerja."]},"terms":[{"ja":"電気空気式エキゾースト・ブレーキ","t":"rem gas buang elektro-pneumatik"},{"ja":"コントロール・シリンダ","t":"silinder kontrol"},{"ja":"マグネティック・バルブ","t":"katup magnetik"},{"ja":"エキゾースト・ブレーキ・カット・リレー","t":"relai pemutus rem gas buang"},{"ja":"エキゾースト・ブレーキ・スイッチ","t":"sakelar rem gas buang"},{"ja":"負圧","t":"tekanan negatif (vakum)"}]},"si":{"stem":"electro-pneumatic exhaust brake පිළිබඳ ප්‍රකාශ අතරින් 【සුදුසු නොවන】 එක කුමක්ද?","choices":["control cylinder එක, negative pressure මඟින් exhaust brake valve එක විවෘත කිරීම සහ වැසීම කරයි.","magnetic valve එක, control cylinder වෙත compressed air සැපයීම සහ පිට කිරීම කරයි.","exhaust brake ක්‍රියාත්මක වන විට, exhaust brake switch, accelerator switch සහ clutch switch ON තත්ත්වයේ ඇත.","exhaust brake cut relay එක, සාමාන්‍ය අවස්ථාවේ ON වී circuit එක සම්බන්ධ වී ඇති අතර, ABS ක්‍රියාත්මක වන විට brake ECU මඟින් OFF වී circuit එක විසන්ධි වේ."],"ex":{"text":"electro-pneumatic exhaust brake. exhaust pipe එක ඇතුළේ valve එක වසා exhaust resistance වැඩි කර engine braking ශක්තිමත් කරයි. පාලනය විදුලියෙන්, ක්‍රියාව compressed air මගිනි. magnetic valve එක control cylinder එකට compressed air සපයයි සහ පිට කරයි, control cylinder එක valve එක විවෘත කරයි සහ වසයි. ක්‍රියා කිරීමට, clutch switch, accelerator switch සහ exhaust brake switch යන 3ම ON විය යුතු අතර, cut relay (සාමාන්‍යයෙන් ON, ABS ක්‍රියා කරන විට OFF) හරහා power supply ලැබිය යුතුයි. rotation speed එක specified value එකට වඩා අඩු වූ විට ECU එක එය අක්‍රිය කරයි. නිවැරදි පිළිතුර (1) වේ. (1) වැරදි වාක්‍යයයි. අනෙක් 3 නිවැරදි වාක්‍ය වේ. වෙනස කොතැනද යන්න එක් එක් choice එකේ පැහැදිලි කිරීම බලන්න.","perChoice":["× negative pressure එකෙන් විවෘත කර වසයි → නිවැරදි කරුණ: compressed air එකෙන් විවෘත කර වසයි (electro-pneumatic type). negative pressure භාවිත කරන්නේ electro-vacuum type එකයි.","○ magnetic valve එක engine ECU signal එකෙන් control cylinder එකට compressed air සැපයීම සහ පිට කිරීම කරයි.","○ ක්‍රියා කරන විට exhaust brake switch, accelerator switch (pedal එක මුදා හළ විට ON) සහ clutch switch (pedal එක මුදා හළ විට ON) සියල්ල ON වේ.","○ exhaust brake cut relay එක සාමාන්‍යයෙන් ON වන අතර, ABS ක්‍රියා කරන විට වැනි අවස්ථාවල brake ECU එක එය OFF කර circuit එක කපයි."]},"terms":[{"ja":"電気空気式エキゾースト・ブレーキ","t":"විදුලි-වායු පිටාර තිරිංගය"},{"ja":"コントロール・シリンダ","t":"පාලන සිලින්ඩරය"},{"ja":"マグネティック・バルブ","t":"චුම්බක කපාටය"},{"ja":"エキゾースト・ブレーキ・カット・リレー","t":"පිටාර තිරිංග කපාහැරීමේ රිලේ"},{"ja":"エキゾースト・ブレーキ・スイッチ","t":"පිටාර තිරිංග ස්විචය"},{"ja":"負圧","t":"සෘණ පීඩනය (vacuum)"}]},"my":{"stem":"လျှပ်စစ်-လေ အမျိုးအစား အိတ်ဇောဘရိတ် (electro-pneumatic exhaust brake) နှင့် ပတ်သက်သော ဖော်ပြချက်အဖြစ် 【မသင့်လျော်သည့်】အချက်မှာ အောက်ပါတို့အနက် မည်သည်နည်း။","choices":["ကွန်ထရိုး ဆလင်ဒါ (control cylinder) သည် အနုတ်ဖိအား (negative pressure / vacuum) ဖြင့် အိတ်ဇောဘရိတ် ဗားလ် (exhaust brake valve) ကို ဖွင့်ခြင်း ပိတ်ခြင်း ပြုလုပ်သည်။","မက်ဂနက်တစ် ဗားလ် (magnetic valve) သည် ကွန်ထရိုး ဆလင်ဒါသို့ ဖိသိပ်လေ (compressed air) ပေးသွင်းခြင်းနှင့် ထုတ်လွှတ်ခြင်းကို ပြုလုပ်သည်။","အိတ်ဇောဘရိတ် အလုပ်လုပ်နေချိန်တွင် အိတ်ဇောဘရိတ် ခလုတ် (exhaust brake switch)၊ အက်ဆယ်လရေတာ ခလုတ် (accelerator switch) နှင့် ကလပ်ချ် ခလုတ် (clutch switch) တို့သည် ON ဖြစ်နေသည်။","အိတ်ဇောဘရိတ် ဖြတ်တောက် ရီလေး (exhaust brake cut relay) သည် ပုံမှန်အချိန်တွင် ON ဖြစ်ပြီး ဆားကစ် ဆက်ထားသော်လည်း ABS အလုပ်လုပ်ချိန်တွင် ဘရိတ် ECU (brake ECU) က OFF ပြုလုပ်၍ ဆားကစ်ကို ဖြတ်တောက်သည်။"],"ex":{"text":"electro-pneumatic exhaust brake။ exhaust pipe အတွင်းရှိ valve ကို ပိတ်ပြီး exhaust resistance ကို တိုးစေကာ engine braking ကို ပိုအားကောင်းစေသည်။ ထိန်းချုပ်မှုမှာ လျှပ်စစ်၊ လုပ်ဆောင်မှုမှာ compressed air ဖြစ်သည်။ magnetic valve သည် control cylinder သို့ compressed air ကို ပေးသွင်း/ထုတ်ပြီး control cylinder က valve ကို ဖွင့်ပိတ်သည်။ လုပ်ဆောင်စေရန် clutch switch၊ accelerator switch နှင့် exhaust brake switch 3 ခုလုံး ON ဖြစ်ပြီး cut relay (ပုံမှန် ON၊ ABS လုပ်ဆောင်ချိန် OFF) မှတစ်ဆင့် power ရောက်ရန် လိုသည်။ rotation speed သတ်မှတ်တန်ဖိုးအောက် ကျလျှင် ECU က ဖြုတ်သည်။ အဖြေမှန်မှာ (1) ဖြစ်သည်။ (1) သည် မှားသော စာကြောင်း ဖြစ်သည်။ ကျန် 3 ခုမှာ မှန်သော စာကြောင်းများ ဖြစ်သည်။ ဘာကွာသလဲဆိုတာ ရွေးချယ်စရာ တစ်ခုချင်းစီ၏ ရှင်းလင်းချက်ကို ကြည့်ပါ။","perChoice":["× negative pressure ဖြင့် ဖွင့်ပိတ် → အမှန်မှာ compressed air ဖြင့် ဖွင့်ပိတ်သည် (electro-pneumatic type)။ negative pressure ကို သုံးသည်မှာ electro-vacuum type ဖြစ်သည်။","○ magnetic valve သည် engine ECU ၏ signal ဖြင့် control cylinder သို့ compressed air ကို ပေးသွင်း/ထုတ်သည်။","○ လုပ်ဆောင်ချိန်တွင် exhaust brake switch၊ accelerator switch (pedal လွှတ်လျှင် ON)၊ clutch switch (pedal လွှတ်လျှင် ON) အားလုံး ON ဖြစ်သည်။","○ exhaust brake cut relay သည် ပုံမှန် ON ဖြစ်ပြီး ABS လုပ်ဆောင်ချိန် စသည်တွင် brake ECU က OFF လုပ်၍ circuit ကို ဖြတ်သည်။"]},"terms":[{"ja":"電気空気式エキゾースト・ブレーキ","t":"လျှပ်စစ်-လေဖိအား အမျိုးအစား အိတ်ဇော ဘရိတ် (electro-pneumatic exhaust brake)"},{"ja":"コントロール・シリンダ","t":"ထိန်းချုပ် ဆလင်ဒါ (control cylinder)"},{"ja":"マグネティック・バルブ","t":"သံလိုက် အဆို့ရှင် (magnetic / solenoid valve)"},{"ja":"エキゾースト・ブレーキ・カット・リレー","t":"အိတ်ဇော ဘရိတ် ဖြတ်တောက် ရီလေး (exhaust brake cut relay)"},{"ja":"エキゾースト・ブレーキ・スイッチ","t":"အိတ်ဇော ဘရိတ် ခလုတ် (exhaust brake switch)"},{"ja":"負圧","t":"အနုတ် ဖိအား / လေဟာ (negative pressure)"}]}}},{"id":"jaspa-R7.10-G-24","sogo":25,"label":"R7.10 二級ガソリン No.24","no":24,"stem":"ツイスト・ペア{線|せん}を{用|もち}いた CAN{通信|つうしん}に{関|かん}する{記述|きじゅつ}として、{適切|てきせつ}なものは{次|つぎ}のうちどれか。","choices":["{各|かく} ECUは、{各|かく}センサの{情報|じょうほう}などをデータ・フレームとして、バス・ライン{上|じょう}に{送信|そうしん}({定期|ていき}{送信|そうしん}データ)している。","“バス・オフ”{状態|じょうたい}とは、エラーを{検知|けんち}した{結果|けっか}、リカバリが{実行|じっこう}され、エラーが{解消|かいしょう}されて{通信|つうしん}を{再開|さいかい}した{状態|じょうたい}をいう。","CAN{通信|つうしん}では、バス・ライン{上|じょう}のデータを{必要|ひつよう}とする{複数|ふくすう}のECUは{同時|どうじ}にデータ・フレームを{受信|じゅしん}することができない。","CAN-H、CAN-Lともに2.5Vの{状態|じょうたい}をドミナントといい、CAN-Hが3.5V、CAN-Lが1.5Vの{状態|じょうたい}をレセシブという。"],"parts":null,"partLabels":null,"answer":1,"fig":null,"exp":{"text":"CAN{通信|つうしん}は2{本|ぽん}の{線|せん}（CAN-H、CAN-L）の{電位差|でんいさ}で{信号|しんごう}を{送|おく}る{多重通信|たじゅうつうしん}である。よく{出|で}る{論点|ろんてん}は{五|いつ}つ。レセシブとドミナントの{電圧|でんあつ}。{受信|じゅしん}は{電位差|でんいさ}で{読|よ}む。{終端抵抗|しゅうたんていこう}1{個|こ}の{断線|だんせん}では{通信|つうしん}は{止|と}まらない。バス・オフの{意味|いみ}。{衝突時|しょうとつじ}は{優先度|ゆうせんど}で{決|き}める。{正解|せいかい}は(1)。{各|かく}ECUはセンサの{情報|じょうほう}をデータ・フレームにして、{決|き}まった{間隔|かんかく}でバス・ラインに{送|おく}っている。これを{定期|ていき}{送信|そうしん}データという。ほかの3つは{誤|あやま}り。どこが{違|ちが}うかは{選択肢|せんたくし}ごとの{説明|せつめい}を{見|み}ること。","perChoice":["○ {各|かく}ECUはセンサ{情報|じょうほう}をデータ・フレームとして{定期的|ていきてき}に{送信|そうしん}する（{定期|ていき}{送信|そうしん}データ）。","× バス・オフ＝リカバリ{後|あと}にエラーが{解消|かいしょう}し{通信|つうしん}を{再開|さいかい}した{状態|じょうたい}→{正|ただ}しくはリカバリしてもエラーが{解消|かいしょう}しないので{通信|つうしん}を{停止|ていし}した{状態|じょうたい}。","× {複数|ふくすう}のECUが{同時|どうじ}に{受信|じゅしん}することはできない→{正|ただ}しくはできる。","× {両方|りょうほう}2.5Vがドミナント、3.5V/1.5Vがレセシブ→{正|ただ}しくは{逆|ぎゃく}。{両方|りょうほう}2.5Vがレセシブ、3.5V/1.5Vがドミナント。"]},"tr":{"en":{"stem":"Which of the following statements about CAN communication using twisted pair wires is appropriate?","choices":["Each ECU transmits information from each sensor, etc. as data frames onto the bus line (periodically transmitted data).","The \"bus-off\" state is a state in which, as a result of detecting an error, recovery was performed, the error was cleared, and communication was resumed.","In CAN communication, multiple ECUs that need data on the bus line cannot receive a data frame at the same time.","The state in which both CAN-H and CAN-L are 2.5V is called dominant, and the state in which CAN-H is 3.5V and CAN-L is 1.5V is called recessive."],"ex":{"text":"CAN communication is multiplex communication that sends signals by the voltage difference between two wires (CAN-H and CAN-L). There are five common test points: the voltages for recessive and dominant; receivers read the voltage difference; if one terminating resistor is broken, communication does not stop; the meaning of bus-off; and when messages collide, priority decides. The correct answer is (1). Each ECU puts sensor information into data frames and sends them on the bus line at fixed intervals. This is called periodic transmission data. The other three are wrong. See the explanation for each choice to find what is wrong.","perChoice":["○ Each ECU sends sensor information regularly as data frames (periodic transmission data).","× Bus-off = the state where the error is cleared after recovery and communication restarts → Correct: it is the state where the error is not cleared even after recovery, so communication is stopped.","× Several ECUs cannot receive at the same time → Correct: they can.","× Both at 2.5 V is dominant, and 3.5 V/1.5 V is recessive → Correct: it is the opposite. Both at 2.5 V is recessive, and 3.5 V/1.5 V is dominant."]},"terms":[{"ja":"データ・フレーム","t":"data frame"},{"ja":"バス・ライン","t":"bus line"},{"ja":"リカバリ","t":"recovery"},{"ja":"ドミナント","t":"dominant"},{"ja":"レセシブ","t":"recessive"},{"ja":"CAN-H","t":"CAN-High"}]},"ne":{"stem":"twisted pair wire प्रयोग गर्ने CAN communication सम्बन्धी कथनहरूमध्ये उपयुक्त कुन हो?","choices":["हरेक ECU ले हरेक sensor को सूचना आदिलाई data frame को रूपमा bus line मा पठाउँछ (periodic transmission data)।","\"bus-off\" state भनेको error पत्ता लागेपछि recovery गरिएर, error हटेर communication फेरि सुरु भएको अवस्था हो।","CAN communication मा bus line को data चाहिने धेरै ECU ले एकै समयमा data frame receive गर्न सक्दैनन्।","CAN-H र CAN-L दुवै 2.5V भएको अवस्थालाई dominant भनिन्छ, र CAN-H 3.5V, CAN-L 1.5V भएको अवस्थालाई recessive भनिन्छ।"],"ex":{"text":"CAN सञ्चार 2 वटा तार (CAN-H र CAN-L) को भोल्टेज फरक (potential difference) बाट सिग्नल पठाउने मल्टिप्लेक्स सञ्चार (multiplex communication) हो। धेरै सोधिने 5 वटा कुरा: रिसेसिभ (recessive) र डोमिनेन्ट (dominant) को भोल्टेज। प्राप्त गर्ने पक्षले भोल्टेज फरकबाट पढ्छ। 1 वटा टर्मिनेसन रेजिस्टर (terminating resistor) चुँडिँदा सञ्चार रोकिँदैन। बस-अफ (bus-off) को अर्थ। टक्कर (collision) हुँदा प्राथमिकता (priority) ले निर्णय हुन्छ। सही उत्तर (1) हो। हरेक ECU ले सेन्सरको जानकारीलाई डाटा फ्रेम बनाएर, तोकिएको समयको अन्तरमा बस लाइनमा पठाउँछ। यसलाई आवधिक प्रसारण डाटा (periodic transmission data) भनिन्छ। बाँकी 3 वटा गलत छन्। कहाँ गलत छ भन्ने कुरा हरेक विकल्पको व्याख्यामा हेर्नुहोस्।","perChoice":["○ हरेक ECU ले सेन्सरको जानकारी डाटा फ्रेमको रूपमा नियमित रूपमा पठाउँछ (आवधिक प्रसारण डाटा)।","× “बस-अफ = रिकभरीपछि त्रुटि हटेर सञ्चार फेरि सुरु भएको अवस्था” भन्ने गलत हो। → सही कुरा: रिकभरी गर्दा पनि त्रुटि नहटेकाले सञ्चार रोकिएको अवस्था हो।","× “धेरै ECU ले एकैसाथ प्राप्त गर्न सक्दैनन्” भन्ने गलत हो। → सही कुरा: सक्छन्।","× “दुवै 2.5V डोमिनेन्ट, 3.5V/1.5V रिसेसिभ” भन्ने गलत हो। → सही कुरा: उल्टो हो। दुवै 2.5V रिसेसिभ, 3.5V/1.5V डोमिनेन्ट हो।"]},"terms":[{"ja":"データ・フレーム","t":"डाटा फ्रेम"},{"ja":"バス・ライン","t":"बस लाइन"},{"ja":"リカバリ","t":"रिकभरी (पुनर्प्राप्ति)"},{"ja":"ドミナント","t":"डोमिनेन्ट"},{"ja":"レセシブ","t":"रिसेसिभ"},{"ja":"CAN-H","t":"CAN-हाई"}]},"zh":{"stem":"关于使用双绞线的CAN通信的叙述中，适当的是下列哪一项？","choices":["各ECU将各传感器的信息等作为数据帧，发送到总线上（定期发送数据）。","“总线关闭”状态是指检测到错误后执行恢复，错误消除后重新开始通信的状态。","在CAN通信中，需要总线上数据的多个ECU不能同时接收数据帧。","CAN-H、CAN-L均为2.5V的状态称为显性，CAN-H为3.5V、CAN-L为1.5V的状态称为隐性。"],"ex":{"text":"CAN通信是用2根线（CAN-H、CAN-L）之间的电位差来传送信号的多路通信。常考的要点有五个：隐性（recessive）和显性（dominant）的电压；接收时读取电位差；1个终端电阻断线时通信不会停止；总线关闭（bus off）的意思；数据冲突时按优先级决定。正确答案是(1)。各ECU把传感器的信息做成数据帧，按一定的间隔发送到总线上。这叫做定期发送数据。其他3项是错误的。错在哪里，请看各选项的说明。","perChoice":["○ 各ECU把传感器信息作为数据帧定期发送（定期发送数据）。","× 总线关闭＝恢复处理后错误消除、通信重新开始的状态 → 正确说法：是进行恢复处理后错误仍不能消除，因而停止通信的状态。","× 多个ECU不能同时接收 → 正确说法：可以同时接收。","× 两线都是2.5V是显性，3.5V/1.5V是隐性 → 正确说法：正好相反。两线都是2.5V是隐性，3.5V/1.5V是显性。"]},"terms":[{"ja":"データ・フレーム","t":"数据帧"},{"ja":"バス・ライン","t":"总线"},{"ja":"リカバリ","t":"恢复"},{"ja":"ドミナント","t":"显性（电平）"},{"ja":"レセシブ","t":"隐性（电平）"},{"ja":"CAN-H","t":"CAN高线"}]},"vi":{"stem":"Về truyền thông CAN dùng dây xoắn đôi (twisted pair), câu nào sau đây là phù hợp?","choices":["Mỗi ECU gửi thông tin của các cảm biến… dưới dạng khung dữ liệu (data frame) lên đường bus (bus line) (dữ liệu gửi định kỳ).","Trạng thái “bus off” là trạng thái mà sau khi phát hiện lỗi, việc phục hồi (recovery) được thực hiện, lỗi được khắc phục và truyền thông bắt đầu lại.","Trong truyền thông CAN, nhiều ECU cần dữ liệu trên đường bus (bus line) không thể nhận khung dữ liệu (data frame) cùng một lúc.","Trạng thái CAN-H và CAN-L đều ở 2.5V gọi là dominant, còn trạng thái CAN-H là 3.5V và CAN-L là 1.5V gọi là recessive."],"ex":{"text":"Truyền thông CAN là truyền thông ghép kênh (multiplex) gửi tín hiệu bằng hiệu điện thế giữa 2 dây (CAN-H, CAN-L). Có 5 điểm hay ra đề: điện áp của trạng thái lặn (recessive) và trạng thái trội (dominant); khi nhận thì đọc bằng hiệu điện thế; đứt 1 điện trở đầu cuối thì truyền thông không bị dừng; ý nghĩa của “bus off”; khi xung đột thì quyết định theo mức ưu tiên. Đáp án đúng là (1). Mỗi ECU đưa thông tin cảm biến vào khung dữ liệu (data frame) và gửi lên đường bus (bus line) theo chu kỳ nhất định. Đây gọi là dữ liệu gửi định kỳ. 3 câu còn lại đều sai. Xem giải thích của từng lựa chọn để biết chỗ sai.","perChoice":["○ Mỗi ECU gửi thông tin cảm biến định kỳ dưới dạng khung dữ liệu (dữ liệu gửi định kỳ).","× Bus off = trạng thái sau khi phục hồi (recovery), lỗi đã hết và truyền thông được tiếp tục → Đúng là: trạng thái dù đã phục hồi nhưng lỗi vẫn không hết, nên dừng truyền thông.","× Nhiều ECU không thể nhận cùng lúc → Đúng là: có thể nhận cùng lúc.","× Cả hai 2.5V là trội (dominant), 3.5V/1.5V là lặn (recessive) → Đúng là: ngược lại. Cả hai 2.5V là lặn (recessive), 3.5V/1.5V là trội (dominant)."]},"terms":[{"ja":"データ・フレーム","t":"khung dữ liệu (data frame)"},{"ja":"バス・ライン","t":"đường truyền bus (bus line)"},{"ja":"リカバリ","t":"phục hồi (recovery)"},{"ja":"ドミナント","t":"trạng thái trội (dominant)"},{"ja":"レセシブ","t":"trạng thái lặn (recessive)"},{"ja":"CAN-H","t":"CAN-H (dây CAN mức cao)"}]},"ind":{"stem":"Manakah pernyataan tentang komunikasi CAN yang menggunakan kabel twisted pair berikut ini yang tepat?","choices":["Setiap ECU mengirimkan informasi dari tiap sensor dan lain-lain sebagai data frame ke bus line (data yang dikirim secara berkala).","Keadaan \"bus-off\" adalah keadaan di mana, sebagai hasil deteksi kesalahan, pemulihan dilakukan, kesalahan hilang, dan komunikasi dimulai kembali.","Pada komunikasi CAN, beberapa ECU yang memerlukan data di bus line tidak dapat menerima satu data frame pada saat yang sama.","Keadaan CAN-H dan CAN-L keduanya 2.5V disebut dominan, dan keadaan CAN-H 3.5V dan CAN-L 1.5V disebut resesif."],"ex":{"text":"Komunikasi CAN adalah komunikasi multipleks yang mengirim sinyal lewat selisih potensial dua kabel (CAN-H dan CAN-L). Ada lima hal yang sering keluar: tegangan resesif dan dominan; penerimaan dibaca dari selisih potensial; putusnya satu resistor terminasi tidak menghentikan komunikasi; arti bus-off; dan saat terjadi tabrakan data, urutan ditentukan oleh prioritas. Jawaban yang benar adalah (1). Setiap ECU membuat informasi sensor menjadi data frame dan mengirimkannya ke bus line pada selang waktu tetap. Ini disebut data kirim berkala. Tiga pernyataan lain salah. Lihat penjelasan tiap pilihan untuk tahu letak salahnya.","perChoice":["○ Setiap ECU mengirim informasi sensor secara berkala sebagai data frame (data kirim berkala).","× Bus-off = keadaan ketika kesalahan hilang setelah pemulihan dan komunikasi dilanjutkan → Yang benar: keadaan ketika komunikasi dihentikan karena kesalahan tidak hilang walaupun sudah dipulihkan.","× Beberapa ECU tidak dapat menerima secara bersamaan → Yang benar: bisa.","× Keduanya 2.5V adalah dominan, 3.5V/1.5V adalah resesif → Yang benar: kebalikannya. Keduanya 2.5V adalah resesif, 3.5V/1.5V adalah dominan."]},"terms":[{"ja":"データ・フレーム","t":"bingkai data (data frame)"},{"ja":"バス・ライン","t":"jalur bus"},{"ja":"リカバリ","t":"pemulihan (recovery)"},{"ja":"ドミナント","t":"dominan (dominant)"},{"ja":"レセシブ","t":"resesif (recessive)"},{"ja":"CAN-H","t":"CAN-H"}]},"si":{"stem":"twisted pair wire භාවිත කරන CAN communication පිළිබඳ ප්‍රකාශ අතරින් සුදුසු එක කුමක්ද?","choices":["එක් එක් ECU, එක් එක් sensor තොරතුරු ආදිය data frame ලෙස bus line මතට යවයි (periodic transmission data).","“bus-off” state යනු, error හඳුනාගත් ප්‍රතිඵලයක් ලෙස recovery සිදු කර, error විසඳී communication නැවත ආරම්භ කළ තත්ත්වයයි.","CAN communication හිදී, bus line මත දත්ත අවශ්‍ය ECU කිහිපයකට එකවර data frame ලබා ගත නොහැක.","CAN-H, CAN-L දෙකම 2.5V වන තත්ත්වය dominant ලෙසද, CAN-H 3.5V, CAN-L 1.5V වන තත්ත්වය recessive ලෙසද හැඳින්වේ."],"ex":{"text":"CAN සන්නිවේදනය (CAN communication) යනු කම්බි 2ක (CAN-H, CAN-L) විභව අන්තරයෙන් සංඥා යවන බහු සන්නිවේදනයකි (multiplex communication). නිතර එන කරුණු පහක් ඇත: රිසෙසිව් (recessive) සහ ඩොමිනන්ට් (dominant) වෝල්ටීයතා. ලැබීම විභව අන්තරයෙන් කියවයි. අන්ත ප්‍රතිරෝධක (terminating resistor) 1ක් කැඩුණත් සන්නිවේදනය නතර නොවේ. බස් ඕෆ් (bus off) යන්නෙහි තේරුම. ගැටුමක් (collision) ඇති වූ විට ප්‍රමුඛතාවයෙන් තීරණය කරයි. නිවැරදි පිළිතුර (1) වේ. සෑම ECU එකක්ම සංවේදක (sensor) තොරතුරු දත්ත රාමුවක් (data frame) බවට පත් කර, නියමිත කාල පරතරයකින් බස් ලයින් (bus line) එකට යවයි. මෙය නිතිපතා යවන දත්ත (periodic transmission data) ලෙස හැඳින්වේ. අනෙක් 3 වැරදියි. වෙනස කොතැනද යන්න එක් එක් විකල්පයේ පැහැදිලි කිරීම බලන්න.","perChoice":["○ සෑම ECU එකක්ම සංවේදක තොරතුරු දත්ත රාමුවක් ලෙස නිතිපතා යවයි (නිතිපතා යවන දත්ත).","× බස් ඕෆ් = ප්‍රතිසාධනයෙන් (recovery) පසු දෝෂය නැති වී සන්නිවේදනය නැවත ආරම්භ කළ තත්ත්වය → නිවැරදි කරුණ: ප්‍රතිසාධනය කළත් දෝෂය නැති නොවන නිසා සන්නිවේදනය නතර කළ තත්ත්වය.","× ECU කිහිපයකට එකවර ලබා ගත නොහැක → නිවැරදි කරුණ: ලබා ගත හැක.","× දෙකම 2.5V ඩොමිනන්ට්, 3.5V/1.5V රිසෙසිව් → නිවැරදි කරුණ: ප්‍රතිවිරුද්ධයි. දෙකම 2.5V රිසෙසිව්, 3.5V/1.5V ඩොමිනන්ට්."]},"terms":[{"ja":"データ・フレーム","t":"දත්ත රාමුව (data frame)"},{"ja":"バス・ライン","t":"බස් ලයින් (bus line)"},{"ja":"リカバリ","t":"ප්‍රතිසාධනය (recovery)"},{"ja":"ドミナント","t":"ප්‍රමුඛ (dominant)"},{"ja":"レセシブ","t":"අප්‍රමුඛ (recessive)"},{"ja":"CAN-H","t":"CAN ඉහළ රේඛාව (CAN-High)"}]},"my":{"stem":"လိမ်တွဲကြိုး (twisted pair wire) ကို သုံးသော CAN ဆက်သွယ်ရေး (CAN communication) နှင့် ပတ်သက်သော ဖော်ပြချက်အဖြစ် သင့်လျော်သည့်အချက်မှာ အောက်ပါတို့အနက် မည်သည်နည်း။","choices":["ECU တစ်ခုစီသည် ဆင်ဆာ တစ်ခုစီ၏ အချက်အလက် စသည်တို့ကို ဒေတာ ဖရိမ် (data frame) အဖြစ် ဘတ်စ် လိုင်း (bus line) ပေါ်သို့ ပို့လွှတ် (ပုံမှန် ပို့လွှတ်သော ဒေတာ) နေသည်။","“ဘတ်စ် အော့ဖ် (bus off)” အခြေအနေ ဆိုသည်မှာ အမှား (error) ကို တွေ့ရှိသည့် ရလဒ်အဖြစ် ပြန်လည်ထူထောင်ခြင်း (recovery) ကို လုပ်ဆောင်ပြီး အမှား ပြေလည်သွား၍ ဆက်သွယ်မှု ပြန်စသော အခြေအနေကို ဆိုသည်။","CAN ဆက်သွယ်ရေးတွင် ဘတ်စ် လိုင်းပေါ်ရှိ ဒေတာ လိုအပ်သော ECU အများအပြားသည် ဒေတာ ဖရိမ်ကို တစ်ပြိုင်နက် လက်ခံ၍ မရပါ။","CAN-H နှင့် CAN-L နှစ်ခုစလုံး 2.5V ဖြစ်နေသော အခြေအနေကို ဒေါ်မီနန့် (dominant) ဟု ခေါ်ပြီး CAN-H က 3.5V၊ CAN-L က 1.5V ဖြစ်နေသော အခြေအနေကို ရီဆက်ဆစ် (recessive) ဟု ခေါ်သည်။"],"ex":{"text":"CAN communication သည် ဝါယာ 2 ချောင်း (CAN-High、CAN-Low) ၏ potential difference ဖြင့် signal ပို့သော multiplex communication ဖြစ်သည်။ မကြာခဏ မေးလေ့ရှိသော အချက် 5 ခု ရှိသည်။ Recessive နှင့် dominant ၏ voltage။ လက်ခံခြင်းကို potential difference ဖြင့် ဖတ်သည်။ Terminating resistor 1 ခု open circuit ဖြစ်ရုံဖြင့် communication မရပ်ပါ။ Bus-off ၏ အဓိပ္ပာယ်။ တိုက်မိသောအခါ priority ဖြင့် ဆုံးဖြတ်သည်။ အဖြေမှန်မှာ (1) ဖြစ်သည်။ ECU တစ်ခုချင်းစီသည် sensor ၏ အချက်အလက်ကို data frame အဖြစ်ပြုလုပ်ပြီး သတ်မှတ်ထားသော ကြားကာလဖြင့် bus line သို့ ပို့နေသည်။ ၎င်းကို periodic transmission data ဟု ခေါ်သည်။ ကျန် 3 ခုမှာ မှားသည်။ ဘယ်နေရာ မှားသလဲဆိုတာ ရွေးချယ်စရာ တစ်ခုချင်းစီ၏ ရှင်းလင်းချက်ကို ကြည့်ပါ။","perChoice":["○ ECU တစ်ခုချင်းစီသည် sensor အချက်အလက်ကို data frame အဖြစ် ပုံမှန် ပို့သည် (periodic transmission data)။","× Bus-off = recovery ပြီးနောက် error ပျောက်ပြီး communication ပြန်စသော အခြေအနေ → အမှန်မှာ- recovery လုပ်သော်လည်း error မပျောက်သောကြောင့် communication ရပ်ထားသော အခြေအနေ။","× ECU အများအပြားသည် တစ်ပြိုင်နက် လက်ခံ၍ မရ → အမှန်မှာ- လက်ခံ၍ ရသည်။","× နှစ်ခုလုံး 2.5V သည် dominant၊ 3.5V/1.5V သည် recessive → အမှန်မှာ- ပြောင်းပြန်။ နှစ်ခုလုံး 2.5V သည် recessive၊ 3.5V/1.5V သည် dominant ဖြစ်သည်။"]},"terms":[{"ja":"データ・フレーム","t":"ဒေတာ ဖရိမ် (data frame)"},{"ja":"バス・ライン","t":"ဘတ်စ် လိုင်း (bus line)"},{"ja":"リカバリ","t":"ပုံမှန် အခြေအနေသို့ ပြန်ရောက်ခြင်း (recovery)"},{"ja":"ドミナント","t":"လွှမ်းမိုးသော အခြေအနေ (dominant)"},{"ja":"レセシブ","t":"လွှမ်းမိုးခံ အခြေအနေ (recessive)"},{"ja":"CAN-H","t":"CAN-H (CAN မြင့် ကြိုး)"}]}}},{"id":"jaspa-R7.10-D-36","sogo":38,"label":"R7.10 二級ジーゼル No.36","no":36,"stem":"「{道路運送車両法|どうろうんそうしゃりょうほう}{施行規則|しこうきそく}」に{照|て}らし、{次|つぎ}の{文章|ぶんしょう}の(イ)と(ロ)に{当|あ}てはまるものとして、{下|した}の{組|く}み{合|あ}わせのうち、{不適切|ふてきせつ}なものはどれか。\n{分解整備|ぶんかいせいび}{及|およ}び{電子制御|でんしせいぎょ}{装置整備|そうちせいび}を{行|おこな}う{事業場|じぎょうじょう}であって、{従事|じゅうじ}する{従業員|じゅうぎょういん}({整備主任者|せいびしゅにんしゃ}を{含|ふく}む。)の{数|かず}が(イ)の{自動車|じどうしゃ}{特定整備|とくていせいび}{事業|じぎょう}の{認証|にんしょう}を{受|う}けた{事業場|じぎょうじょう}には、{一級|いっきゅう}、{二級又|にきゅうまた}は{三級|さんきゅう}の{自動車|じどうしゃ}{整備士|せいびし}の{技能検定|ぎのうけんてい}に{合格|ごうかく}した{者|もの}が(ロ){以上|いじょう}であること。","choices":["(イ) 3{人|にん}　(ロ) 1{人|にん}","(イ) 8{人|にん}　(ロ) 2{人|にん}","(イ) 10{人|にん}　(ロ) 3{人|にん}","(イ) 16{人|にん}　(ロ) 3{人|にん}"],"parts":["3{人|にん}\t1{人|にん}","8{人|にん}\t2{人|にん}","10{人|にん}\t3{人|にん}","16{人|にん}\t3{人|にん}"],"partLabels":["イ","ロ"],"answer":4,"fig":null,"exp":{"text":"{道路運送車両法|どうろうんそうしゃりょうほう}{施行規則|しこうきそく}の{認証基準|にんしょうきじゅん}の{問題|もんだい}。{特定整備|とくていせいび}に{従事|じゅうじ}する{従業員|じゅうぎょういん}は2{人|にん}{以上|いじょう}{必要|ひつよう}である。そのうち{一級|いっきゅう}・{二級|にきゅう}・{三級|さんきゅう}の{自動車|じどうしゃ}{整備士|せいびし}の{合格者|ごうかくしゃ}は、{従業員|じゅうぎょういん}の{数|かず}を4で{割|わ}った{数|かず}（1{未満|みまん}の{端数|はすう}は1とする、つまり{切|き}り{上|あ}げ）{以上|いじょう}いなければならない。{例|れい}として、5{人|にん}→2{人|にん}、8{人|にん}→2{人|にん}、9{人|にん}→3{人|にん}、10{人|にん}→3{人|にん}、16{人|にん}→4{人|にん}、17{人|にん}→5{人|にん}となる。さらに、この{問題|もんだい}の{事業場|じぎょうじょう}は{分解整備|ぶんかいせいび}と{電子制御|でんしせいぎょ}{装置整備|そうちせいび}の{両方|りょうほう}を{行|おこな}うので、{少|すく}なくとも1{人|にん}は{次|つぎ}のどちらかでなければならない。①{一級|いっきゅう}の{自動車|じどうしゃ}{整備士|せいびし}（{一級二輪|いちきゅうにりん}を{除|のぞ}く）。②{一級二輪|いちきゅうにりん}または{二級|にきゅう}の{自動車|じどうしゃ}{整備士|せいびし}で、{運輸監理部長|うんゆかんりぶちょう}または{運輸支局長|うんゆしきょくちょう}が{行|おこな}う{電子制御|でんしせいぎょ}{装置整備|そうちせいび}の{講習|こうしゅう}を{修了|しゅうりょう}した{人|ひと}。{二級|にきゅう}に{合格|ごうかく}しただけでは{足|た}りない。この{問題|もんだい}は「{不適切|ふてきせつ}な{組|く}み{合|あ}わせ」を{選|えら}ぶので、{正解|せいかい}は(4)。16{人|にん}なら16÷4＝4で、4{人|にん}{以上|いじょう}が{必要|ひつよう}になる。(ロ)の3{人|にん}では{足|た}りない。（{施行規則|しこうきそく}{第|だい}57{条|じょう}）","perChoice":["○ 3{人|にん}の{場合|ばあい}、3÷4＝0.75で、{端数|はすう}を{切|き}り{上|あ}げて1{人|にん}{以上|いじょう}。(ロ)の1{人|にん}と{合|あ}うので{適切|てきせつ}な{組|く}み{合|あ}わせ。","○ 8{人|にん}の{場合|ばあい}、8÷4＝2で2{人|にん}{以上|いじょう}。(ロ)の2{人|にん}と{合|あ}うので{適切|てきせつ}な{組|く}み{合|あ}わせ。","○ 10{人|にん}の{場合|ばあい}、10÷4＝2.5で、{切|き}り{上|あ}げて3{人|にん}{以上|いじょう}。(ロ)の3{人|にん}と{合|あ}うので{適切|てきせつ}な{組|く}み{合|あ}わせ。","× (ロ)の「3{人|にん}」が{誤|あやま}り。16{人|にん}の{場合|ばあい}は16÷4＝4なので、{正|ただ}しくは4{人|にん}{以上|いじょう}が{必要|ひつよう}。これが{不適切|ふてきせつ}な{組|く}み{合|あ}わせ。"]},"tr":{"en":{"stem":"In light of the \"Ordinance for Enforcement of the Road Transport Vehicle Act\", which of the following combinations is inappropriate for (イ) and (ロ) in the following passage?\nAt a place of business certified for the motor vehicle specified maintenance business that performs overhaul maintenance and electronic control device maintenance, where the number of employees engaged in the work (including the chief maintenance technician) is (イ), the number of persons who have passed the skill test for first-, second-, or third-class automobile mechanics must be (ロ) or more.","choices":["(イ) 3 persons　(ロ) 1 person","(イ) 8 persons　(ロ) 2 persons","(イ) 10 persons　(ロ) 3 persons","(イ) 16 persons　(ロ) 3 persons"],"ex":{"text":"This question is about the certification standards in the Road Transport Vehicle Act Enforcement Regulations (道路運送車両法施行規則). A shop needs 2 or more employees who do specified maintenance. Among them, the number of people who passed the class 1, class 2, or class 3 automobile mechanic test must be at least the number of employees divided by 4 (a fraction less than 1 counts as 1, so round up). For example: 5 people → 2, 8 people → 2, 9 people → 3, 10 people → 3, 16 people → 4, 17 people → 5. Also, the shop in this question does both overhaul maintenance and electronic control system maintenance. So at least 1 person must be one of these: ① a class 1 automobile mechanic (not class 1 motorcycle). ② a class 1 motorcycle or class 2 automobile mechanic who finished the electronic control system maintenance course held by the Director of the Transport Supervision Department or the Transport Branch Office. Only passing class 2 is not enough. This question asks for the \"NOT appropriate combination\", so the correct answer is (4). For 16 people, 16÷4＝4, so 4 or more people are needed. 3 people in (ロ) is not enough. (Enforcement Regulations Article 57)","perChoice":["○ For 3 people, 3÷4＝0.75. Round up, so 1 or more people. This matches 1 person in (ロ), so it is an appropriate combination.","○ For 8 people, 8÷4＝2, so 2 or more people. This matches 2 people in (ロ), so it is an appropriate combination.","○ For 10 people, 10÷4＝2.5. Round up, so 3 or more people. This matches 3 people in (ロ), so it is an appropriate combination.","× \"3 people\" in (ロ) is wrong. For 16 people, 16÷4＝4 → Correct: 4 or more people are needed. This is the NOT appropriate combination."]},"terms":[{"ja":"道路運送車両法施行規則","t":"Ordinance for Enforcement of the Road Transport Vehicle Act"},{"ja":"分解整備","t":"disassembly maintenance"},{"ja":"整備主任者","t":"chief maintenance technician"},{"ja":"自動車特定整備事業","t":"specified automobile maintenance business"},{"ja":"技能検定","t":"skills certification test"},{"ja":"自動車整備士","t":"automobile mechanic"}]},"ne":{"stem":"「सडक यातायात सवारी साधन ऐन कार्यान्वयन नियमावली (Enforcement Regulations of the Road Transport Vehicle Act)」 अनुसार, तलको वाक्यको (イ) र (ロ) मा पर्ने संयोजनमध्ये 【अनुपयुक्त】 कुन हो?\ndisassembly maintenance र electronic control device maintenance गर्ने workshop मध्ये, काम गर्ने कर्मचारी (chief maintenance technician समेत) को संख्या (イ) भएको, specified automobile maintenance business को certification पाएको workshop मा, पहिलो, दोस्रो वा तेस्रो श्रेणीको automobile mechanic skill test पास गरेका व्यक्ति (ロ) वा बढी हुनुपर्छ।","choices":["(イ) 3 जना　(ロ) 1 जना","(イ) 8 जना　(ロ) 2 जना","(イ) 10 जना　(ロ) 3 जना","(イ) 16 जना　(ロ) 3 जना"],"ex":{"text":"सडक यातायात सवारी साधन ऐन कार्यान्वयन नियमावली (Road Transport Vehicle Act Enforcement Regulations) को certification मापदण्डको प्रश्न। specified maintenance गर्ने कर्मचारी 2 जना वा बढी चाहिन्छ। तीमध्ये class 1, class 2, class 3 mechanic परीक्षा पास गर्ने मान्छे, कर्मचारी संख्यालाई 4 ले भाग गरेको संख्या (1 भन्दा कम भाग भए 1 मान्ने, अर्थात् माथि round up) वा बढी हुनुपर्छ। उदाहरण: 5 जना→2 जना, 8 जना→2 जना, 9 जना→3 जना, 10 जना→3 जना, 16 जना→4 जना, 17 जना→5 जना। साथै यो shop ले overhaul maintenance र electronic control system maintenance दुवै गर्छ, त्यसैले कम्तीमा 1 जना यीमध्ये एक हुनुपर्छ। ① class 1 mechanic (class 1 motorcycle बाहेक)। ② class 1 motorcycle वा class 2 mechanic, जसले Transport Supervision Department प्रमुख वा Transport Branch Office प्रमुखले गर्ने electronic control system maintenance तालिम पूरा गरेको छ। class 2 पास मात्र पुग्दैन। यो प्रश्नले 【अनुपयुक्त】 combination सोध्छ, त्यसैले सही उत्तर (4) हो। 16 जना भए 16÷4＝4, त्यसैले 4 जना वा बढी चाहिन्छ। (ロ) को 3 जना पुग्दैन। (नियमावली धारा 57)","perChoice":["○ 3 जना भए 3÷4＝0.75, round up गरेर 1 जना वा बढी। (ロ) को 1 जनासँग मिल्छ, त्यसैले उपयुक्त combination।","○ 8 जना भए 8÷4＝2, 2 जना वा बढी। (ロ) को 2 जनासँग मिल्छ, त्यसैले उपयुक्त combination।","○ 10 जना भए 10÷4＝2.5, round up गरेर 3 जना वा बढी। (ロ) को 3 जनासँग मिल्छ, त्यसैले उपयुक्त combination।","× (ロ) को「3 जना」गलत। 16 जना भए 16÷4＝4 → सही कुरा: 4 जना वा बढी चाहिन्छ। यो 【अनुपयुक्त】 combination हो।"]},"terms":[{"ja":"道路運送車両法施行規則","t":"सडक यातायात सवारी ऐन कार्यान्वयन नियमावली"},{"ja":"分解整備","t":"खोलेर गर्ने मर्मत"},{"ja":"整備主任者","t":"मर्मत प्रमुख"},{"ja":"自動車特定整備事業","t":"विशेष सवारी मर्मत व्यवसाय"},{"ja":"技能検定","t":"सीप परीक्षा"},{"ja":"自動車整備士","t":"सवारी मेकानिक"}]},"zh":{"stem":"对照《道路运输车辆法施行规则》，下列文章中填入(イ)和(ロ)的内容，下列组合中不适当的是哪一项？\n在进行分解维修及电子控制装置维修的营业场所中，从业员工（包括维修主任者）人数为(イ)的取得汽车特定维修业务认证的营业场所，一级、二级或三级汽车维修士技能检定合格者应在(ロ)以上。","choices":["(イ) 3人　(ロ) 1人","(イ) 8人　(ロ) 2人","(イ) 10人　(ロ) 3人","(イ) 16人　(ロ) 3人"],"ex":{"text":"这是《道路运输车辆法施行规则》认证标准的问题。从事特定整备的员工需要2人以上。其中一级、二级、三级汽车整备士合格者，必须不少于员工人数除以4的数（不足1的尾数按1计，即进位）。例如：5人→2人，8人→2人，9人→3人，10人→3人，16人→4人，17人→5人。另外，本题的事业场同时进行分解整备和电子控制装置整备，所以至少1人必须是以下之一：①一级汽车整备士（一级二轮除外）。②一级二轮或二级汽车整备士，并修完运输监理部长或运输支局长举办的电子控制装置整备讲习。只通过二级是不够的。本题要选\"不适当的组合\"，所以正确答案是(4)。16人时16÷4＝4，需要4人以上。(ロ)的3人不够。（施行规则第57条）","perChoice":["○ 3人时，3÷4＝0.75，尾数进位为1人以上。与(ロ)的1人相符，是适当的组合。","○ 8人时，8÷4＝2，2人以上。与(ロ)的2人相符，是适当的组合。","○ 10人时，10÷4＝2.5，进位为3人以上。与(ロ)的3人相符，是适当的组合。","× (ロ)的\"3人\"错误。16人时16÷4＝4 → 正确说法：需要4人以上。这是不适当的组合。"]},"terms":[{"ja":"道路運送車両法施行規則","t":"道路运输车辆法实施规则"},{"ja":"分解整備","t":"拆解维修"},{"ja":"整備主任者","t":"维修主任"},{"ja":"自動車特定整備事業","t":"汽车特定维修事业"},{"ja":"技能検定","t":"技能鉴定"},{"ja":"自動車整備士","t":"汽车维修工"}]},"vi":{"stem":"Theo “Quy tắc thi hành Luật Phương tiện vận tải đường bộ” (道路運送車両法施行規則), trong các tổ hợp dưới đây, tổ hợp nào là KHÔNG phù hợp để điền vào (イ) và (ロ) của đoạn văn sau?\nỞ cơ sở làm bảo dưỡng tháo rã (分解整備) và bảo dưỡng thiết bị điều khiển điện tử (電子制御装置整備) đã được chứng nhận kinh doanh bảo dưỡng đặc định ô tô, nếu số nhân viên làm việc (kể cả người phụ trách bảo dưỡng - 整備主任者) là (イ), thì số người đã đỗ kỳ thi kỹ năng thợ bảo dưỡng ô tô cấp 1, cấp 2 hoặc cấp 3 phải từ (ロ) trở lên.","choices":["(イ) 3 người　(ロ) 1 người","(イ) 8 người　(ロ) 2 người","(イ) 10 người　(ロ) 3 người","(イ) 16 người　(ロ) 3 người"],"ex":{"text":"Đây là câu hỏi về tiêu chuẩn chứng nhận trong Quy tắc thi hành Luật Xe cơ giới vận tải đường bộ (道路運送車両法施行規則). Cần 2 nhân viên trở lên làm bảo dưỡng đặc định. Trong đó, số người đậu kỳ thi thợ máy ô tô hạng 1, hạng 2 hoặc hạng 3 phải từ số nhân viên chia cho 4 trở lên (phần lẻ dưới 1 tính là 1, tức là làm tròn lên). Ví dụ: 5 người→2 người, 8 người→2 người, 9 người→3 người, 10 người→3 người, 16 người→4 người, 17 người→5 người. Ngoài ra, cơ sở trong câu này làm cả bảo dưỡng tháo rời và bảo dưỡng hệ thống điều khiển điện tử, nên ít nhất 1 người phải là một trong hai: ① thợ máy ô tô hạng 1 (trừ hạng 1 xe hai bánh). ② thợ máy hạng 1 xe hai bánh hoặc hạng 2, đã hoàn thành khóa học bảo dưỡng hệ thống điều khiển điện tử do Cục trưởng Cục giám sát vận tải hoặc Chi cục trưởng vận tải tổ chức. Chỉ đậu hạng 2 thì chưa đủ. Câu này chọn \"tổ hợp KHÔNG phù hợp\", nên đáp án đúng là (4). 16 người thì 16÷4＝4, cần từ 4 người trở lên. 3 người ở (ロ) là không đủ. (Quy tắc thi hành Điều 57)","perChoice":["○ 3 người: 3÷4＝0.75, làm tròn lên là từ 1 người trở lên. Khớp với 1 người ở (ロ), nên là tổ hợp phù hợp.","○ 8 người: 8÷4＝2, từ 2 người trở lên. Khớp với 2 người ở (ロ), nên là tổ hợp phù hợp.","○ 10 người: 10÷4＝2.5, làm tròn lên là từ 3 người trở lên. Khớp với 3 người ở (ロ), nên là tổ hợp phù hợp.","× \"3 người\" ở (ロ) là sai. 16 người thì 16÷4＝4 → Đúng là: cần từ 4 người trở lên. Đây là tổ hợp KHÔNG phù hợp."]},"terms":[{"ja":"道路運送車両法施行規則","t":"Quy tắc thi hành Luật Phương tiện Vận tải Đường bộ"},{"ja":"分解整備","t":"bảo dưỡng có tháo rã (disassembly maintenance)"},{"ja":"整備主任者","t":"người phụ trách chính về bảo dưỡng"},{"ja":"自動車特定整備事業","t":"ngành kinh doanh bảo dưỡng đặc định ô tô (specified maintenance business)"},{"ja":"技能検定","t":"kỳ thi kiểm định tay nghề"},{"ja":"自動車整備士","t":"thợ bảo dưỡng ô tô (kỹ thuật viên ô tô)"}]},"ind":{"stem":"Menurut \"Peraturan Pelaksanaan Undang-Undang Kendaraan Angkutan Jalan\", manakah kombinasi berikut ini yang tidak tepat untuk (イ) dan (ロ) pada kalimat berikut?\nDi tempat usaha yang melakukan perawatan bongkar (overhaul) dan perawatan perangkat kontrol elektronik serta telah mendapat sertifikasi usaha perawatan khusus mobil, bila jumlah karyawan yang bekerja (termasuk kepala mekanik) adalah (イ), jumlah orang yang lulus uji keterampilan mekanik mobil kelas 1, kelas 2, atau kelas 3 harus (ロ) atau lebih.","choices":["(イ) 3 orang　(ロ) 1 orang","(イ) 8 orang　(ロ) 2 orang","(イ) 10 orang　(ロ) 3 orang","(イ) 16 orang　(ロ) 3 orang"],"ex":{"text":"Ini soal tentang standar sertifikasi dalam Peraturan Pelaksanaan Undang-Undang Kendaraan Angkutan Jalan (道路運送車両法施行規則). Perlu 2 karyawan atau lebih yang melakukan perawatan khusus. Di antara mereka, jumlah orang yang lulus ujian mekanik mobil kelas 1, kelas 2, atau kelas 3 harus minimal jumlah karyawan dibagi 4 (pecahan kurang dari 1 dihitung 1, artinya dibulatkan ke atas). Contoh: 5 orang→2 orang, 8 orang→2 orang, 9 orang→3 orang, 10 orang→3 orang, 16 orang→4 orang, 17 orang→5 orang. Selain itu, bengkel di soal ini melakukan perawatan bongkar (overhaul) dan perawatan sistem kontrol elektronik (electronic control system), jadi minimal 1 orang harus salah satu dari ini: ① mekanik mobil kelas 1 (kecuali kelas 1 sepeda motor). ②
